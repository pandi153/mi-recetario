<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07192d">
<title>Pandi · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07192d;--surface:#0d2740;--surface2:#102d48;--text:#f3f7fb;--muted:#9eb1c5;--accent:#a7df3f;--border:#294965;--today:#1d4f86;--warn:#f0b24a;--bad:#ff7b7b;--ok:#6fd48b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
#app{display:grid;grid-template-columns:88px 1fr;height:100%;gap:10px;padding:10px}
/* columna de botones */
#rail{display:flex;flex-direction:column;gap:10px}
#rail a,#rail button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;font-size:13px;font-weight:600}
#rail a span,#rail button span{font-size:28px;line-height:1}
#rail a:active,#rail button:active{background:var(--surface2)}
#rail .small{flex:.55;font-size:11px;color:var(--muted)}
#rail .small span{font-size:18px}
/* rejilla principal */
#main{display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0;min-width:0}
#top{display:grid;grid-template-columns:.8fr 1.35fr 1fr;gap:10px;height:clamp(150px,25vh,230px)}
#bottom{display:grid;grid-template-columns:1.45fr 1fr;gap:10px;min-height:0}
#side{display:grid;grid-template-rows:1fr auto;gap:10px;min-height:0;min-width:0}
#side2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;min-width:0}
.card{padding:12px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel{overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ctitle{font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ctitle b{font-weight:800;color:var(--text);font-size:13px;letter-spacing:0}
/* reloj */
#clockcard{background:linear-gradient(135deg,#1c2a5c,#2e3d86);justify-content:center;border-color:#3b4b9a}
#time{font-size:clamp(46px,11vh,104px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#date{margin-top:6px;font-size:clamp(15px,2.6vh,22px);color:#d3dbff}
#date b{font-weight:700;color:#fff}
/* tiempo */
#wcard{justify-content:center;cursor:pointer}
.wnow{display:flex;align-items:center;gap:14px}
.wico{font-size:clamp(44px,9vh,80px);line-height:1}
.wtemp{font-size:clamp(34px,7vh,60px);font-weight:700;line-height:1}
.wsub{font-size:13px;color:var(--muted);margin-top:4px}
.wdays{display:flex;gap:6px;margin-top:8px}
.wd{flex:1;background:var(--surface2);border-radius:12px;padding:5px 2px;text-align:center;font-size:12px;line-height:1.25}
.wd i{font-style:normal;display:block;font-size:20px}
.wd small{color:var(--muted)}
.wset{display:flex;flex-direction:column;gap:8px;font-size:14px}
.wset input{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
.wset button{background:var(--accent);color:#10200a;padding:10px;border-radius:10px;font-weight:700}
/* hoy se come */
#todaycard{background:linear-gradient(135deg,#1c7a4a,#27a064);border-color:#37b878;color:#fff}
#todaycard .ctitle,#todaycard .ctitle b{color:#dff7e8}
#todaybody{overflow:auto;display:flex;flex-direction:column;gap:6px}
.tm{display:flex;gap:10px;align-items:flex-start;line-height:1.2}
.tm i{font-style:normal;font-size:20px;width:26px;text-align:center;flex:none}
.tm small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cdeedb}
.tm span{font-size:clamp(15px,2.6vh,21px);font-weight:700}
.tm em{font-style:italic;font-weight:600}
.tm.minor span{font-size:14px;font-weight:600}
/* calendario */
.phead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;gap:8px}
.seg{display:flex;gap:4px}
.seg button{padding:6px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:13px}
.seg button.on{background:var(--accent);color:#10200a;border-color:var(--accent);font-weight:700}
#calwrap{flex:1;min-height:0;background:#fff}
#calwrap iframe{width:100%;height:100%;border:0;display:block}
.setup{padding:22px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.4;background:var(--surface);height:100%;overflow:auto}
.setup input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
.setup .go{background:var(--accent);color:#10200a;padding:12px;border-radius:10px;font-weight:700}
.setup ol{padding-left:20px;color:var(--muted);font-size:14px}
/* menú de la semana */
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:17px}
.nav button.txt{width:auto;padding:0 10px;font-size:13px}
#weekbody{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:5px}
.day{display:grid;grid-template-columns:44px 1fr;gap:8px;border:1px solid var(--border);border-radius:12px;padding:6px 8px;background:var(--surface2);align-items:center}
.day.today{background:var(--today);border-color:#4b8fd6}
.day.past{opacity:.5}
.dn{text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);line-height:1.1}
.dn b{display:block;font-size:20px;color:var(--text);letter-spacing:0}
.day.today .dn,.day.today .dn b{color:#fff}
.dm{min-width:0;font-size:13px;line-height:1.35}
.dm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm i{font-style:normal;margin-right:6px}
.dm em{font-style:italic;color:var(--muted)}
.none{color:var(--muted)}
/* caducidad y compra */
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;line-height:1.5}
.row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;flex:none;align-self:center}
.badge.bad{background:#ff7b7b30;color:var(--bad)}
.badge.warn{background:#f0b24a30;color:var(--warn)}
.big{font-size:clamp(22px,4vh,34px);font-weight:700;line-height:1.1}
.ok{color:var(--ok);font-size:14px;margin-top:4px}
.muted{color:var(--muted);font-size:13px}
/* vista de 7 días (eventos como tarjetas) */
#next{margin-top:8px;font-size:clamp(12px,2.1vh,16px);color:#c8d2ff;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#next b{color:#fff}
#calnav{display:none}
body.c7 #calnav{display:flex}
body.c7 #bottom{grid-template-columns:1fr;grid-template-rows:1fr auto}
body.c7 #side{display:contents}
body.c7 #weekpanel{display:none}
body.c7 #expcard .row:nth-child(n+5),body.c7 #expcard .muted{display:none}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:8px;height:100%;background:var(--surface)}
.col{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:8px;display:flex;flex-direction:column;min-width:0;min-height:0}
.col.today{background:#14385f;border-color:#4b8fd6}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ch span{font-weight:700;font-size:14px;color:var(--muted)}
.ch b{font-size:24px;line-height:1}
.col.today .ch span{color:#ff9aa5}
.chips{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.chip{border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;color:#10200a;background:#c5e07a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.ev{border-left:4px solid var(--c,#6fd48b);padding:1px 0 1px 8px;line-height:1.2}
.ev small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ev span{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.ev.past{opacity:.45}
.noev{color:var(--muted);font-size:13px}
.menubox{margin-top:6px;background:#1b4a3a;border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.3;max-height:36%;overflow:hidden;flex:none}
.col.today .menubox{background:#1f7a4a}
.menubox div{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.menubox i{font-style:normal;margin-right:4px}
.menubox em{font-style:italic;opacity:.85}
.menubox .none{opacity:.6}
/* login */
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:10}
#login form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:min(380px,90vw);display:flex;flex-direction:column;gap:12px}
#login input{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
#login button{background:var(--accent);color:#10200a;padding:12px;border-radius:10px;font-weight:700}
#msg{color:#e0707e;font-size:14px;min-height:18px}
/* pantallas estrechas (móvil): todo en una columna con scroll */
@media (max-width:900px){
  html,body{overflow:auto}
  #app{display:block;height:auto;min-height:100%}
  #rail{flex-direction:row;height:64px;margin-bottom:10px}
  #rail .small{display:none}
  #rail a{flex-direction:row;justify-content:center;font-size:12px}
  #main,#top,#bottom,#side,#side2{display:flex;flex-direction:column;gap:10px;height:auto}
  #top>*{min-height:130px}
  #calpanel{height:480px}
  #weekpanel{height:420px}
  body.c7 #side{display:flex}
  body.c7 #weekpanel{display:none}
  .cols{grid-template-columns:1fr;height:auto;overflow:auto}
  .col{min-height:150px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="rail">
    <a href="index.html?tab=menu"><span>📅</span>Menú</a>
    <a href="index.html?tab=recipes"><span>🍳</span>Recetas</a>
    <a href="index.html?tab=shop"><span>🛒</span>Compra</a>
    <a href="index.html?tab=pantry"><span>🥫</span>Despensa</a>
    <button class="small" id="fs" type="button"><span>⛶</span>Pantalla completa</button>
    <button class="small" id="calcfg" type="button"><span>⚙️</span>Calendario</button>
  </nav>

  <main id="main">
    <section id="top">
      <div class="card" id="clockcard"><div id="time">--:--</div><div id="date"></div><div id="next"></div></div>
      <div class="card" id="wcard"></div>
      <a class="card" id="todaycard" href="index.html?tab=menu">
        <div class="ctitle"><span>Hoy se come</span></div>
        <div id="todaybody"><div class="muted">Cargando…</div></div>
      </a>
    </section>

    <section id="bottom">
      <div class="panel" id="calpanel">
        <div class="phead"><span>🗓️ Calendario Familia</span>
          <div class="nav" id="calnav"><button id="cprev" type="button">‹</button><button id="cnow" class="txt" type="button">Hoy</button><button id="cnext" type="button">›</button></div>
          <div class="seg" id="calseg"><button data-m="7D" type="button">7 días</button><button data-m="WEEK" type="button">Semana</button><button data-m="MONTH" type="button">Mes</button></div>
        </div>
        <div id="calwrap"></div>
      </div>

      <aside id="side">
        <div class="panel" id="weekpanel">
          <div class="phead">
            <span>🍽️ Menú <small id="weeklabel" class="muted"></small></span>
            <div class="nav"><button id="prev" type="button">‹</button><button id="thisw" class="txt" type="button">Hoy</button><button id="next" type="button">›</button></div>
          </div>
          <div id="weekbody"><div class="muted" style="padding:8px">Cargando…</div></div>
        </div>
        <div id="side2">
          <a class="card" id="expcard" href="index.html?tab=pantry"></a>
          <a class="card" id="shopcard" href="index.html?tab=shop"></a>
        </div>
      </aside>
    </section>
  </main>
</div>

<div id="login">
  <form id="loginform">
    <h2>Pandi · Dashboard</h2>
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div id="msg"></div>
  </form>
</div>

<script>
/* ===== 1. Conexión (la misma que usa la app) ===== */
const SUPABASE_URL = 'https://hgjojgxspclmuwaeenjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LPRAkNBsVLKUZLDfAMD6dQ_kaMErp_2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const MEALS = [['desayuno','Desayuno','🥞'],['almuerzo','Almuerzo','🍎'],['comida','Comida','🍽️'],['merienda','Merienda','🥪'],['cena','Cena','🌙']];
const DAYS = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const LOCICON = { congelador: '❄️', frigorifico: '🧊', despensa: '🥫' };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = t => { const [y, m, d] = t.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay()+6)%7));
const daysTo = s => { const t = new Date(); return Math.round((parseYmd(s) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000); };
const slotItems = v => Array.isArray(v) ? v : (v ? [v] : []);
const isNote = x => String(x).startsWith('~');
const cap = s => { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };

let user = null, RECIPES = new Map(), PANTRY = [], SHOP = {}, WEEKS = {}, weekStart = mondayOf(new Date());

/* ===== 2. Reloj ===== */
function tick() {
  const n = new Date();
  $('time').textContent = n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  $('date').innerHTML = `<b>${cap(n.toLocaleDateString('es-ES', { weekday: 'long' }))}</b> ${n.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}`;
}
tick(); setInterval(() => { tick(); updateNext(); }, 10000);

/* ===== 3. Tiempo (Open-Meteo, sin claves) ===== */
const WMO = c => c === 0 ? '☀️' : c === 1 ? '🌤️' : c === 2 ? '⛅' : c === 3 ? '☁️' : (c === 45 || c === 48) ? '🌫️' : (c >= 51 && c <= 57) ? '🌦️' : (c >= 61 && c <= 67) ? '🌧️' : (c >= 71 && c <= 77) ? '❄️' : (c >= 80 && c <= 82) ? '🌦️' : (c === 85 || c === 86) ? '🌨️' : c >= 95 ? '⛈️' : '🌡️';
let wEdit = false;
function cityGet() { try { return JSON.parse(lsGet('dash-city', 'null')); } catch (e) { return null; } }
function weatherSetup(msg) {
  $('wcard').innerHTML = `<div class="wset"><div class="ctitle"><span>Tiempo</span></div>
    <input id="cityin" placeholder="Tu ciudad (ej. Valencia)" value="${esc((cityGet() || {}).name || '')}">
    <button id="citygo" type="button">Buscar</button><div class="muted" id="citymsg">${esc(msg || '')}</div></div>`;
  $('citygo').onclick = async e => {
    e.stopPropagation(); const q = $('cityin').value.trim(); if (!q) return; $('citymsg').textContent = 'Buscando…';
    try {
      const r = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name=' + encodeURIComponent(q))).json();
      const c = r.results && r.results[0]; if (!c) { $('citymsg').textContent = 'No encuentro esa ciudad. Prueba con otro nombre.'; return; }
      lsSet('dash-city', JSON.stringify({ name: c.name, lat: c.latitude, lon: c.longitude })); wEdit = false; loadWeather();
    } catch (err) { $('citymsg').textContent = 'Sin conexión. Inténtalo de nuevo.'; }
  };
  $('cityin').onclick = e => e.stopPropagation();
}
async function loadWeather() {
  const c = cityGet(); if (!c || wEdit) return weatherSetup(c ? '' : 'Pon tu ciudad para ver el tiempo.');
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=6`;
    const w = await (await fetch(u)).json(), d = w.daily;
    const days = [1, 2, 3, 4, 5].filter(i => d.time[i]).map(i => `<div class="wd"><small>${cap(parseYmd(d.time[i]).toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', ''))}</small><i>${WMO(d.weather_code[i])}</i>${Math.round(d.temperature_2m_max[i])}° <small>${Math.round(d.temperature_2m_min[i])}°</small></div>`).join('');
    $('wcard').innerHTML = `<div class="ctitle"><span>📍 ${esc(c.name)}</span><span class="muted">toca para cambiar</span></div>
      <div class="wnow"><div class="wico">${WMO(w.current.weather_code)}</div>
      <div><div class="wtemp">${Math.round(w.current.temperature_2m)}°</div><div class="wsub">${Math.round(d.temperature_2m_min[0])}° / ${Math.round(d.temperature_2m_max[0])}° · 💧 ${d.precipitation_probability_max[0] ?? 0}%</div></div></div>
      <div class="wdays">${days}</div>`;
  } catch (e) { $('wcard').innerHTML = `<div class="ctitle"><span>Tiempo</span></div><div class="muted">No se pudo cargar el tiempo. Reintentando…</div>`; }
}
$('wcard').addEventListener('click', e => { if (e.target.closest('.wset')) return; wEdit = true; weatherSetup(''); });

/* ===== 4. Calendario ===== */
const CAL_KEY = 'dash-cal';
const EVOK = () => lsGet('dash-evok', '0') === '1';
let calMode = lsGet('dash-calmode', EVOK() ? '7D' : 'WEEK');
if (!['7D', 'WEEK', 'MONTH'].includes(calMode)) calMode = 'WEEK';
let readyRes; const ready = new Promise(r => { readyRes = r; });
const startOfToday = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
let c7Start = startOfToday(), colTok = 0, NEXTEV = [];

function calUrl(raw) {
  raw = (raw || '').trim(); if (!raw) return '';
  const m = raw.match(/src="([^"]+)"/); if (m) raw = m[1].replace(/&amp;/g, '&');
  let u;
  if (/^https?:\/\//.test(raw)) u = new URL(raw);
  else u = new URL('https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(raw));
  ['showTitle','showPrint','showTabs','showCalendars','showTz'].forEach(k => u.searchParams.set(k, '0'));
  u.searchParams.set('hl', 'es'); u.searchParams.set('wkst', '2'); u.searchParams.set('mode', calMode === 'MONTH' ? 'MONTH' : 'WEEK');
  if (!u.searchParams.get('ctz')) u.searchParams.set('ctz', Intl.DateTimeFormat().resolvedOptions().timeZone);
  return u.toString();
}
function renderCal(edit) {
  document.querySelectorAll('#calseg button').forEach(b => b.classList.toggle('on', b.dataset.m === calMode));
  document.body.classList.toggle('c7', calMode === '7D' && !edit);
  if (calMode === '7D' && !edit) return renderCols();
  colTok++;
  const saved = lsGet(CAL_KEY, ''), url = calUrl(saved), w = $('calwrap');
  if (url && !edit) { w.innerHTML = `<iframe src="${esc(url)}" title="Calendario"></iframe>`; return; }
  w.innerHTML = `<div class="setup">
    <b style="font-size:18px">Conectar el calendario de Google</b>
    <ol><li>En Google Calendar (versión de ordenador) → Configuración → tu calendario “Familia”.</li>
    <li>Baja hasta “Integrar el calendario” y copia el <b>ID del calendario</b>.</li><li>Pégalo aquí.</li></ol>
    <input id="calinput" placeholder="Pega aquí el ID, la URL o el código" value="${esc(saved)}">
    <button class="go" id="calsave" type="button">Guardar</button>
    <div class="muted">Si el calendario es privado, la tablet debe tener la sesión de Google iniciada en el navegador.</div></div>`;
  $('calsave').onclick = () => { lsSet(CAL_KEY, $('calinput').value.trim()); renderCal(false); };
}
$('calseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; calMode = b.dataset.m; lsSet('dash-calmode', calMode); renderCal(false); });
$('calcfg').onclick = () => renderCal(true);
$('cprev').onclick = () => { c7Start = addDays(c7Start, -7); renderCols(); };
$('cnext').onclick = () => { c7Start = addDays(c7Start, 7); renderCols(); };
$('cnow').onclick = () => { c7Start = startOfToday(); renderCols(); };

/* --- eventos de Google a través de la función "calendario" de Supabase --- */
async function fetchEvents(from, to) {
  const { data, error } = await sb.functions.invoke('quick-action', { body: { from: ymd(from), to: ymd(to) } });
  if (error) {
    let msg = error.message || 'error';
    try {
      const c = error.context;
      if (c && typeof c.text === 'function') {
        const t = await c.text();
        try { const j = JSON.parse(t); msg = j.error || j.message || t; } catch (e) { msg = t || msg; }
        if (c.status) msg = '(' + c.status + ') ' + msg;
      }
    } catch (e) {}
    throw new Error(msg);
  }
  if (!data || !Array.isArray(data.events)) throw new Error((data && data.error) || 'sin respuesta');
  return data.events;
}
const evOnDay = (evs, d) => { const k = ymd(d); return evs.filter(e => e.allDay ? (e.start <= k && k < (e.end || '9')) : ymd(new Date(e.start)) === k).sort((a, b) => a.allDay === b.allDay ? String(a.start).localeCompare(String(b.start)) : (a.allDay ? -1 : 1)); };
const PAL = ['#6fd48b', '#ff8fa3', '#7db7ff', '#ffcb6b', '#c39bff', '#5fd6d0'];
const evColor = t => { const w = String(t || '').trim().split(/\s+/).pop().toLowerCase(); let h = 0; for (const ch of w) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
const hhmm = iso => new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

function c7Error(err) {
  const w = $('calwrap');
  if (EVOK()) { w.innerHTML = `<div class="setup"><div class="muted">No se pudieron cargar los eventos. Reintentando…</div></div>`; setTimeout(() => { if (calMode === '7D') renderCols(); }, 60000); return; }
  document.body.classList.remove('c7');
  w.innerHTML = `<div class="setup"><b style="font-size:18px">No se pudieron cargar los eventos</b>
    <div class="muted">No se han podido leer los eventos. Mira el detalle de abajo: dice qué le falta a la función de Supabase.</div>
    <div class="muted">Detalle: ${esc(err && err.message || err)}</div>
    <button class="go" id="usegoogle" type="button">Usar el calendario de Google mientras tanto</button></div>`;
  $('usegoogle').onclick = () => { calMode = 'WEEK'; lsSet('dash-calmode', 'WEEK'); renderCal(false); };
}
async function renderCols() {
  const tok = ++colTok, w = $('calwrap'), days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(c7Start, i));
  if (!w.querySelector('.cols')) w.innerHTML = `<div class="setup"><div class="muted">Cargando eventos…</div></div>`;
  await ready;
  let evs;
  try { evs = await fetchEvents(days[0], days[6]); } catch (e) { if (tok === colTok) c7Error(e); return; }
  lsSet('dash-evok', '1');
  await Promise.all([...new Set(days.map(d => ymd(mondayOf(d))))].map(ws => getWeek(ws)));
  if (tok !== colTok || calMode !== '7D') return;
  const now = new Date(), today = ymd(now);
  w.innerHTML = '<div class="cols">' + days.map(d => {
    const k = ymd(d), isT = k === today, list = evOnDay(evs, d), allday = list.filter(e => e.allDay), timed = list.filter(e => !e.allDay);
    const md = ((WEEKS[ymd(mondayOf(d))] || [])[(d.getDay() + 6) % 7]) || {};
    const ml = (arr) => arr.map(([key, , ic]) => { const its = slotItems(md[key]).filter(Boolean); return its.length ? `<div><i>${ic}</i>${its.map(itemHtml).join(' · ')}</div>` : ''; }).join('');
    const menu = ml([MEALS[2], MEALS[4]]) || ml([MEALS[0], MEALS[1], MEALS[3]]);
    return `<div class="col${isT ? ' today' : ''}"><div class="ch"><span>${isT ? 'Hoy' : cap(d.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', ''))}</span><b>${d.getDate()}</b></div>
      ${allday.length ? `<div class="chips">${allday.map(e => `<div class="chip" style="background:${evColor(e.title)}">${esc(e.title)}</div>`).join('')}</div>` : ''}
      <div class="evs">${timed.length ? timed.map(e => `<div class="ev${isT && new Date(e.end) < now ? ' past' : ''}" style="--c:${evColor(e.title)}"><small>${hhmm(e.start)}${e.end ? '–' + hhmm(e.end) : ''}</small><span>${esc(e.title)}</span></div>`).join('') : (allday.length ? '' : '<div class="noev">—</div>')}</div>
      <div class="menubox">${menu || '<div class="none">Sin menú</div>'}</div></div>`;
  }).join('') + '</div>';
}
/* próximo evento (línea bajo el reloj) */
async function loadNext() {
  if (!EVOK()) return;
  try { const t = startOfToday(); NEXTEV = await fetchEvents(t, addDays(t, 7)); updateNext(); } catch (e) {}
}
function updateNext() {
  const el = $('next'), now = new Date(), n = NEXTEV.filter(e => !e.allDay && new Date(e.start) > now).sort((a, b) => new Date(a.start) - new Date(b.start))[0];
  if (!n) { el.textContent = ''; return; }
  const min = Math.round((new Date(n.start) - now) / 60000);
  const when = min < 60 ? `en ${min} min` : min < 1440 ? `en ${Math.floor(min / 60)} h ${min % 60} min` : cap(new Date(n.start).toLocaleDateString('es-ES', { weekday: 'long' })) + ' ' + hhmm(n.start);
  el.innerHTML = `Próximo: <b>${esc(n.title)}</b> · ${when}`;
}

/* ===== 5. Sesión ===== */
$('loginform').addEventListener('submit', async e => {
  e.preventDefault(); $('msg').textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('msg').textContent = error ? 'Correo o contraseña incorrectos.' : '';
});
sb.auth.onAuthStateChange((_ev, session) => {
  if (session && (!user || user.id !== session.user.id)) { user = session.user; $('login').style.display = 'none'; start(); }
  if (!session) { user = null; $('login').style.display = 'flex'; }
});

/* ===== 6. Datos de la app ===== */
async function loadRecipes() {
  const { data, error } = await sb.from('recipes').select('id,name');
  if (!error && data) RECIPES = new Map(data.map(r => [r.id, r.name]));
}
async function getWeek(ws, force) {
  if (!force && WEEKS[ws]) return WEEKS[ws];
  const { data, error } = await sb.from('weeks').select('menu').eq('week_start', ws).maybeSingle();
  if (error) return WEEKS[ws] || [];
  return (WEEKS[ws] = Array.isArray(data && data.menu) ? data.menu : []);
}
async function loadWeeks() {
  const cur = ymd(mondayOf(new Date())); WEEKS = {};
  await Promise.all([getWeek(cur, true), getWeek(ymd(weekStart), true)]);
  renderToday(); renderWeek(); if (calMode === '7D') renderCols();
}
async function loadPantry() {
  const { data, error } = await sb.from('pantry').select('*');
  if (!error && data) PANTRY = data; renderExp();
}
async function loadShop() {
  const { data, error } = await sb.from('settings').select('shopping_checked').maybeSingle();
  if (!error) { const v = data && data.shopping_checked; SHOP = v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } renderShop();
}

/* ===== 7. Widgets ===== */
const itemHtml = x => isNote(x) ? `<em>${esc(String(x).slice(1))}</em>` : esc(RECIPES.get(x) || '…');

function renderToday() {
  const cur = ymd(mondayOf(new Date())), i = (new Date().getDay() + 6) % 7, day = ((WEEKS[cur] || [])[i]) || {};
  const rows = MEALS.map(([k, l, ic]) => ({ k, l, ic, its: slotItems(day[k]).filter(Boolean) })).filter(m => m.its.length);
  $('todaybody').innerHTML = rows.length
    ? rows.map(m => `<div class="tm${(m.k === 'comida' || m.k === 'cena') ? '' : ' minor'}"><i>${m.ic}</i><div><small>${m.l}</small><span>${m.its.map(itemHtml).join(' · ')}</span></div></div>`).join('')
    : `<div class="tm"><i>🤷</i><div><span>Nada planificado hoy</span><small>Toca para planificar</small></div></div>`;
}

function renderWeek() {
  const today = ymd(new Date()), mon = weekStart, sun = addDays(mon, 6), menu = WEEKS[ymd(mon)] || [];
  const f = d => d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
  $('weeklabel').textContent = `${f(mon)} – ${f(sun)}`;
  let h = '';
  for (let i = 0; i < 7; i++) {
    const date = addDays(mon, i), key = ymd(date), d = (menu[i] && typeof menu[i] === 'object') ? menu[i] : {};
    const line = ([k, , ic]) => { const its = slotItems(d[k]).filter(Boolean); return its.length ? `<div><i>${ic}</i>${its.map(itemHtml).join(' · ')}</div>` : ''; };
    let rows = line(MEALS[2]) + line(MEALS[4]);
    if (!rows) rows = [MEALS[0], MEALS[1], MEALS[3]].map(line).join('');
    h += `<div class="day${key === today ? ' today' : key < today ? ' past' : ''}"><div class="dn">${DAYS[i]}<b>${date.getDate()}</b></div><div class="dm">${rows || '<div class="none">—</div>'}</div></div>`;
  }
  $('weekbody').innerHTML = h;
  const t = $('weekbody').querySelector('.day.today'); if (t) t.scrollIntoView({ block: 'nearest' });
}
$('prev').onclick = async () => { weekStart = addDays(weekStart, -7); await getWeek(ymd(weekStart), true); renderWeek(); };
$('next').onclick = async () => { weekStart = addDays(weekStart, 7); await getWeek(ymd(weekStart), true); renderWeek(); };
$('thisw').onclick = async () => { weekStart = mondayOf(new Date()); await getWeek(ymd(weekStart)); renderWeek(); };

function renderExp() {
  const list = PANTRY.filter(p => p.expiry_date && Number(p.units ?? 1) > 0).map(p => ({ p, d: daysTo(p.expiry_date) })).filter(x => x.d <= 3).sort((a, b) => a.d - b.d);
  const bad = list.filter(x => x.d < 0).length;
  const badge = d => d < 0 ? `<span class="badge bad">caducado</span>` : d === 0 ? `<span class="badge bad">hoy</span>` : d === 1 ? `<span class="badge warn">mañana</span>` : `<span class="badge warn">${d} días</span>`;
  $('expcard').innerHTML = `<div class="ctitle"><span>⏰ Caduca pronto</span>${list.length ? `<b>${list.length}</b>` : ''}</div>` +
    (list.length ? list.slice(0, 5).map(x => `<div class="row"><span>${LOCICON[x.p.location] || '🥫'} ${esc(cap(x.p.name))}</span>${badge(x.d)}</div>`).join('') + (list.length > 5 ? `<div class="muted">y ${list.length - 5} más…</div>` : '')
      : `<div class="ok">✅ Nada caduca en los próximos 3 días</div>`);
}

function renderShop() {
  const w = SHOP[ymd(mondayOf(new Date()))] || {}, items = (Array.isArray(w.x) ? w.x : []).filter(x => !x.d && x.t);
  $('shopcard').innerHTML = `<div class="ctitle"><span>🛒 Compra</span></div>` +
    (items.length ? `<div class="big">${items.length} ${items.length === 1 ? 'cosa apuntada' : 'cosas apuntadas'}</div><div class="muted" style="margin-top:4px;line-height:1.4">${items.slice(0, 5).map(x => esc(x.t)).join(' · ')}${items.length > 5 ? '…' : ''}</div>`
      : `<div class="ok">✅ Nada apuntado a mano</div><div class="muted" style="margin-top:4px">Toca para ver la lista completa</div>`);
}

/* ===== 8. Arranque, tiempo real y modo tablet ===== */
let started = false;
async function start() {
  if (started) return; started = true; readyRes();
  await loadRecipes(); loadNext();
  await Promise.all([loadWeeks(), loadPantry(), loadShop()]);
  sb.channel('dash-' + user.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'weeks' }, loadWeeks)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'recipes' }, async () => { await loadRecipes(); renderToday(); renderWeek(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pantry' }, loadPantry)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, loadShop)
    .subscribe();
  setInterval(() => { loadRecipes().then(() => Promise.all([loadWeeks(), loadPantry(), loadShop()])); loadNext(); }, 10 * 60 * 1000);
}
setInterval(loadWeather, 30 * 60 * 1000);
// al cambiar de día: semana actual y todo refrescado
let lastDay = ymd(new Date());
setInterval(() => {
  const k = ymd(new Date());
  if (k !== lastDay) { lastDay = k; weekStart = mondayOf(new Date()); if (user) { loadWeeks(); loadPantry(); } }
}, 30000);

// pantalla siempre encendida
async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('click', keepAwake, { once: true });
keepAwake();
$('fs').onclick = () => { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen())); };

renderCal(false); loadWeather();
</script>
