<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07192d">
<title>Pandi · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07192d;--surface:#0d2740;--surface2:#102d48;--text:#f3f7fb;--muted:#9eb1c5;--accent:#a7df3f;--border:#294965;--today:#1d4f86}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:grid;grid-template-columns:92px 1fr 38%;height:100%;gap:10px;padding:10px}
/* columna de botones */
#rail{display:flex;flex-direction:column;gap:10px}
#rail a,#rail button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;text-decoration:none;color:var(--text);font-size:13px;font-weight:600}
#rail a span,#rail button span{font-size:30px;line-height:1}
#rail a:active,#rail button:active{background:var(--surface2)}
#rail .small{flex:.6;font-size:11px;color:var(--muted)}
#rail .small span{font-size:20px}
/* paneles */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.phead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:17px;gap:8px}
.phead small{color:var(--muted);font-weight:500;font-size:13px}
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:18px}
.nav button.txt{width:auto;padding:0 12px;font-size:14px}
#calwrap{flex:1;min-height:0;background:#fff}
#calwrap iframe{width:100%;height:100%;border:0;display:block}
.setup{padding:22px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.4;color:var(--text);background:var(--surface);height:100%;overflow:auto}
.setup input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
.setup .go{background:var(--accent);color:#10200a;padding:12px;border-radius:10px;font-weight:700}
.setup ol{padding-left:20px;color:var(--muted);font-size:14px}
/* menú */
#menubody{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.day{border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface2)}
.day.today{background:var(--today);border-color:#4b8fd6}
.day.past{opacity:.55}
.dname{font-size:12px;letter-spacing:.06em;font-weight:800;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.day.today .dname{color:#d6e9ff}
.meal{display:flex;gap:8px;font-size:14px;line-height:1.3;padding:2px 0}
.meal i{font-style:normal;width:22px;flex:none;text-align:center}
.meal b{font-weight:600}
.meal em{font-style:normal;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:2px 0}
/* login / mensajes */
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:10}
#login form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:min(380px,90vw);display:flex;flex-direction:column;gap:12px}
#login input{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
#login button{background:var(--accent);color:#10200a;padding:12px;border-radius:10px;font-weight:700}
#msg{color:#e0707e;font-size:14px;min-height:18px}
#clock{font-variant-numeric:tabular-nums}
@media (max-width:900px){#app{grid-template-columns:70px 1fr}#menupanel{display:none}}
</style>
</head>
<body>
<div id="app">
  <nav id="rail">
    <a href="index.html?tab=menu"><span>📅</span>Menú</a>
    <a href="index.html?tab=recipes"><span>🍳</span>Recetas</a>
    <a href="index.html?tab=shop"><span>🛒</span>Compra</a>
    <a href="index.html?tab=pantry"><span>🥫</span>Despensa</a>
    <button class="small" id="fs" type="button"><span>⛶</span>Pantalla completa</button>
    <button class="small" id="calcfg" type="button"><span>⚙️</span>Calendario</button>
  </nav>

  <section class="panel">
    <div class="phead"><span>🗓️ Calendario Familia</span><small id="clock"></small></div>
    <div id="calwrap"></div>
  </section>

  <section class="panel" id="menupanel">
    <div class="phead">
      <span>🍽️ Menú <small id="weeklabel"></small></span>
      <div class="nav"><button id="prev" type="button">‹</button><button id="thisw" class="txt" type="button">Hoy</button><button id="next" type="button">›</button></div>
    </div>
    <div id="menubody"><div class="empty">Cargando…</div></div>
  </section>
</div>

<div id="login">
  <form id="loginform">
    <h2>Pandi · Dashboard</h2>
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div id="msg"></div>
  </form>
</div>

<script>
/* ===== 1. Conexión (la misma que usa la app) ===== */
const SUPABASE_URL = 'https://hgjojgxspclmuwaeenjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LPRAkNBsVLKUZLDfAMD6dQ_kaMErp_2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MEALS = [['desayuno','Desayuno','🥞'],['almuerzo','Almuerzo','🍎'],['comida','Comida','🍽️'],['merienda','Merienda','🥪'],['cena','Cena','🌙']];
const DAYS = ['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay()+6)%7));
const slotItems = v => Array.isArray(v) ? v : (v ? [v] : []);
const isNote = x => String(x).startsWith('~');

let user = null, RECIPES = new Map(), weekStart = mondayOf(new Date()), MENU = [];

/* ===== 2. Calendario de Google ===== */
const CAL_KEY = 'dash-cal';
function calUrl(raw) {
  raw = (raw || '').trim(); if (!raw) return '';
  const m = raw.match(/src="([^"]+)"/); if (m) raw = m[1].replace(/&amp;/g, '&');
  if (/^https?:\/\//.test(raw)) {
    const u = new URL(raw);
    ['showTitle','showPrint','showTabs','showCalendars','showTz'].forEach(k => u.searchParams.set(k, '0'));
    u.searchParams.set('hl', 'es'); u.searchParams.set('wkst', '2');
    if (!u.searchParams.get('mode')) u.searchParams.set('mode', 'WEEK');
    return u.toString();
  }
  // solo un ID o correo del calendario
  return 'https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(raw) +
    '&ctz=' + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone) +
    '&mode=WEEK&hl=es&wkst=2&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0';
}
function renderCal(edit) {
  const saved = localStorage.getItem(CAL_KEY) || '', url = calUrl(saved), w = $('calwrap');
  if (url && !edit) { w.innerHTML = `<iframe src="${esc(url)}" title="Calendario"></iframe>`; return; }
  w.innerHTML = `<div class="setup">
    <b style="font-size:18px">Conectar el calendario de Google</b>
    <ol>
      <li>En Google Calendar (en el navegador del ordenador) → ⚙️ Configuración → pulsa tu calendario “Familia”.</li>
      <li>Baja hasta <b>“Integrar el calendario”</b> y copia el <b>“Código de inserción”</b> (o la URL pública).</li>
      <li>Pégalo aquí. También vale solo el ID del calendario.</li>
    </ol>
    <input id="calinput" placeholder="Pega aquí el código, la URL o el ID" value="${esc(saved)}">
    <button class="go" id="calsave" type="button">Guardar</button>
    <div style="color:var(--muted);font-size:13px">Si el calendario es privado, esta tablet debe tener la sesión de Google iniciada en el navegador.</div>
  </div>`;
  $('calsave').onclick = () => { localStorage.setItem(CAL_KEY, $('calinput').value.trim()); renderCal(false); };
}

/* ===== 3. Sesión ===== */
function showLogin(on) { $('login').style.display = on ? 'flex' : 'none'; }
$('loginform').addEventListener('submit', async e => {
  e.preventDefault(); $('msg').textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('msg').textContent = error ? 'Correo o contraseña incorrectos.' : '';
});
sb.auth.onAuthStateChange((_ev, session) => {
  if (session && (!user || user.id !== session.user.id)) { user = session.user; showLogin(false); start(); }
  if (!session) { user = null; showLogin(true); }
});

/* ===== 4. Menú de la semana ===== */
async function loadRecipes() {
  const { data, error } = await sb.from('recipes').select('id,name');
  if (!error && data) RECIPES = new Map(data.map(r => [r.id, r.name]));
}
async function loadWeek() {
  const ws = ymd(weekStart);
  const { data, error } = await sb.from('weeks').select('menu').eq('week_start', ws).maybeSingle();
  if (error) { $('menubody').innerHTML = '<div class="empty">No se pudo cargar el menú. Reintentando…</div>'; return; }
  MENU = Array.isArray(data && data.menu) ? data.menu : [];
  renderMenu();
}
function itemText(x) { return isNote(x) ? `<em>${esc(String(x).slice(1))}</em>` : `<b>${esc(RECIPES.get(x) || '…')}</b>`; }
function renderMenu() {
  const today = ymd(new Date()), mon = weekStart, sun = addDays(mon, 6);
  const f = d => d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  $('weeklabel').textContent = `${f(mon)} – ${f(sun)}`;
  let h = '';
  for (let i = 0; i < 7; i++) {
    const date = addDays(mon, i), key = ymd(date), d = (MENU[i] && typeof MENU[i] === 'object') ? MENU[i] : {};
    const rows = MEALS.map(([k, label, ic]) => {
      const its = slotItems(d[k]).filter(Boolean); if (!its.length) return '';
      return `<div class="meal"><i title="${label}">${ic}</i><span>${its.map(itemText).join(' · ')}</span></div>`;
    }).join('');
    const cls = key === today ? ' today' : (key < today ? ' past' : '');
    h += `<div class="day${cls}"><div class="dname"><span>${DAYS[i]}</span><span>${date.getDate()}</span></div>${rows || '<div class="empty">—</div>'}</div>`;
  }
  $('menubody').innerHTML = h;
  const t = $('menubody').querySelector('.day.today'); if (t) t.scrollIntoView({ block: 'nearest' });
}
$('prev').onclick = () => { weekStart = addDays(weekStart, -7); loadWeek(); };
$('next').onclick = () => { weekStart = addDays(weekStart, 7); loadWeek(); };
$('thisw').onclick = () => { weekStart = mondayOf(new Date()); loadWeek(); };

/* ===== 5. Arranque, tiempo real y modo tablet ===== */
let started = false;
async function start() {
  if (started) return; started = true;
  await loadRecipes(); await loadWeek();
  sb.channel('dash-' + user.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'weeks' }, loadWeek)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'recipes' }, async () => { await loadRecipes(); renderMenu(); })
    .subscribe();
  setInterval(() => { loadRecipes().then(loadWeek); }, 10 * 60 * 1000);
}
// al cambiar de día, volver a la semana actual
let lastDay = ymd(new Date());
setInterval(() => {
  const n = new Date(), k = ymd(n);
  $('clock').textContent = n.toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  if (k !== lastDay) { lastDay = k; weekStart = mondayOf(n); if (user) loadWeek(); }
}, 20000);
$('clock').textContent = new Date().toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

// pantalla siempre encendida
let wl = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('click', keepAwake, { once: true });
keepAwake();

$('fs').onclick = () => { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen())); };
$('calcfg').onclick = () => renderCal(true);
renderCal(false);
</script>
</body>
</html>
