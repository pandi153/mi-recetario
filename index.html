<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pandi recetas</title>
<meta name="theme-color" content="#07192d">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#07192d;--surface:#0d2740;--surface2:#102d48;--text:#f3f7fb;--muted:#9eb1c5;--accent:#a7df3f;--border:#294965;--danger:#e0707e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.hidden{display:none!important}
.btn{border:0;border-radius:8px;padding:11px 14px;background:var(--accent);color:#07192d;font:inherit;font-weight:700;cursor:pointer}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid #46637d}
input{width:100%;padding:13px;margin:6px 0;border:1px solid #355570;border-radius:9px;background:var(--surface2);color:var(--text);font:inherit;font-size:16px}
.notice{color:var(--muted);font-size:13px;margin-top:10px;min-height:18px}
.notice.err{color:var(--danger)}

/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.login-box h1{margin:0 0 4px;font-size:26px}
.login-box p{margin:0 0 12px;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}

/* App */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:#07192df2;border-bottom:1px solid var(--border)}
header h1{flex:1;margin:0;font-size:22px}
#cloudBtn,#optBtn{width:42px;height:42px;padding:0;font-size:20px}
#cloudBtn.ok{background:var(--accent);color:#07192d;border-color:var(--accent)}
#cloudBtn.err{background:#5b2630;border-color:#9b4a57}
main{max-width:900px;margin:auto;padding:14px 12px 96px}
.tab{display:none}.tab.active{display:block}
.tab h2{margin:4px 2px 12px;font-size:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:10px}
.card{background:var(--surface2);border:1px solid #244763;border-radius:11px;padding:11px 12px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:15px}.card small{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07192df7;border-top:1px solid var(--border);padding-bottom:max(7px,env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:var(--muted);padding:9px 3px 7px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
nav button span{display:block;font-size:21px}
nav button.active{color:var(--accent)}

/* Diagnóstico */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(1,9,18,.72)}
.modal.show{display:flex}
.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px}
.sheet h2{margin:0 0 6px}
.check{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.check b.ok{color:var(--accent)}.check b.fail{color:var(--danger)}
.check small{display:block;color:var(--muted);font-weight:400}

/* Recetas */
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.tools select,.field textarea,.field select{width:100%;padding:12px;border:1px solid #355570;border-radius:9px;background:var(--surface2);color:var(--text);font:inherit;font-size:16px}
.tools select{grid-column:1/-1}
.count{color:var(--muted);font-size:13px;margin:2px 2px 10px}
.rcard{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--surface2);border:1px solid #244763;border-radius:11px;padding:9px;margin-bottom:8px;cursor:pointer}
.thumb{width:84px;height:76px;border-radius:9px;background:#1b3d5e;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.rcard h3{margin:2px 0 4px;font-size:15px}.rcard small{display:block;color:var(--muted);font-size:12px}.rcard .tags{color:var(--accent);font-size:11px;margin-top:4px}
.field{margin:12px 0}.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:0;border-radius:999px;padding:8px 12px;background:#2c4f74;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#07192d;font-weight:700}
.chip.add{background:transparent;border:2px dashed #5f84bd}
.photo-prev{height:150px;border:1px solid #355570;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;margin-bottom:8px}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.detail-photo{height:190px;border-radius:12px;overflow:hidden;margin-bottom:12px}.detail-photo img{width:100%;height:100%;object-fit:cover}
.ing{background:var(--surface2);border-radius:8px;padding:9px 11px;margin:5px 0}
.step{margin:8px 0;white-space:pre-wrap}
.sheet h3{margin:16px 0 6px;font-size:15px}
.btn.danger{background:#5b2630;color:#fff;border:1px solid #9b4a57}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
nav button span svg{width:23px;height:23px;vertical-align:-4px}
.editbar{position:sticky;top:0;z-index:3;background:var(--surface);margin:-18px -18px 0;padding:14px 18px 8px;border-bottom:1px solid var(--border)}
.editbar .sheet-top h2{font-size:18px}.editbar .btns{display:flex;gap:8px}.editbar .btn{padding:9px 14px}
.menuitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:14px;border:1px solid #355570;border-radius:11px;background:var(--surface2);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.menuitem small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.catrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.catrow>span{flex:1;font-size:15px}.catrow small{color:var(--muted)}
.catrow input{margin:0;padding:9px}.catrow input.ico{width:56px;text-align:center}
.catrow .btn{padding:8px 11px}
.rcard{position:relative}.rcard h3{padding-right:30px}
.star{position:absolute;top:2px;right:2px;border:0;background:none;font-size:21px;padding:7px;cursor:pointer;color:var(--accent)}
.btns2{display:flex;gap:8px}.sheet-top .btns2 .btn{padding:9px 12px}
.weeknav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch}
.weeknav .btn{padding:0;font-size:16px}
.weeklabel{border:1px solid #355570;border-radius:10px;background:var(--surface2);color:var(--text);font:inherit;font-weight:700;padding:8px;cursor:pointer}
.weeklabel small{display:block;color:var(--accent);font-size:11px;font-weight:600}
.day{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px;margin-bottom:10px}
.day.today{border-color:var(--accent)}
.day h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center}
.day h3 span{color:var(--text)}.day h3 em{font-style:normal;background:var(--accent);color:#07192d;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}
.slot{display:grid;grid-template-columns:24px 78px 1fr;align-items:center;gap:6px;width:100%;text-align:left;margin:4px 0;padding:10px;border:1px dashed #355570;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.slot.full{border:1px solid #244763;background:var(--surface2);color:var(--text)}
.slot .ml{font-size:12px;color:var(--muted)}.slot .mr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.slot:not(.full) .mr{font-weight:400}
.pick{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;width:100%;text-align:left;margin:5px 0;padding:7px;border:1px solid #244763;border-radius:10px;background:var(--surface2);color:var(--text);font:inherit;cursor:pointer}
.pick.sel{border-color:var(--accent)}.pick small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.pthumb{width:46px;height:46px;border-radius:8px;background:#1b3d5e;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px}.pthumb img{width:100%;height:100%;object-fit:cover}
#pickBody .editbar input{margin:8px 0 0}#pickBody .editbar .row{margin:8px 0 0}
.noterow{display:flex;gap:8px;margin:12px 0 4px}.noterow input{margin:0;flex:1}.noterow .btn{flex:none}
.slot .mr.note{font-weight:400;font-style:italic}
.sgroup{margin:16px 2px 6px;font-size:12px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.sitem{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:center;padding:10px;margin:4px 0;border:1px solid #244763;border-radius:10px;background:var(--surface2);cursor:pointer}
.sitem .box{font-size:20px;color:var(--accent)}.sitem b{font-weight:600}
.sitem small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:1px}
.sitem .sqty{color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.sitem.done{opacity:.5}.sitem.done b,.sitem.done .sqty{text-decoration:line-through}
.sitem .xdel{padding:5px 9px}
.progress{height:8px;border-radius:99px;background:#1b3d5e;overflow:hidden;margin:4px 0 2px}.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.weeknav{position:sticky;top:var(--hh,64px);z-index:4;background:var(--bg);padding:6px 0 8px;margin-top:-4px}
.day{scroll-margin-top:calc(var(--hh,64px) + 66px)}
.loc4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.locbtn{border:1px solid #355570;border-radius:12px;background:var(--surface2);color:var(--text);padding:9px 2px 7px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;line-height:1.2}
.locbtn span{display:block;font-size:21px;margin-bottom:2px}.locbtn small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.locbtn.on{background:var(--accent);border-color:var(--accent);color:#07192d}.locbtn.on small{color:#07192d}
.alertbar{width:100%;margin:10px 0 0;padding:10px;border:1px solid #9b4a57;border-radius:10px;background:#3a1d26;color:#ffd3d9;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.pcard{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px;margin-bottom:7px;border:1px solid #244763;border-radius:11px;background:var(--surface2);cursor:pointer}
.pico{font-size:24px;text-align:center}.pcard small{display:block;color:var(--muted);font-size:12px}
.exp{display:inline-block;margin-top:3px;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}.exp.warn{color:#f0b24a}.exp.bad{color:var(--danger)}
.scards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.scard{background:var(--surface2);border:1px solid #244763;border-radius:11px;padding:10px 12px}
.scard strong{display:block;font-size:22px}.scard span{font-size:11px;color:var(--muted)}
.ssec{margin:20px 0 6px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ssec small{color:var(--muted);font-weight:400;font-size:12px}
.goal{padding:9px 0;border-bottom:1px solid var(--border)}
.goal .gtop{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.goal small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.goal.warn .progress i{background:#f0b24a}.goal.bad .progress i{background:var(--danger)}
.streak{margin:10px 0 0;padding:10px 12px;border:1px solid #244763;border-radius:10px;background:var(--surface2);font-size:13px;line-height:1.5}
.brow{display:grid;grid-template-columns:130px 1fr 26px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.brow .bar{height:10px;border-radius:99px;background:#1b3d5e;overflow:hidden}.brow .bar i{display:block;height:100%;background:#4b83d1}
.sel{width:100%;padding:11px;border:1px solid #355570;border-radius:9px;background:var(--surface2);color:var(--text);font:inherit;font-size:16px;margin:6px 0}
.chart{position:relative;height:140px;display:flex;align-items:flex-end;gap:6px;margin-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.barcol i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.barcol b{font-size:11px;margin-bottom:2px}.barcol small{font-size:10px;color:var(--muted);margin-top:3px;height:14px;white-space:nowrap}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed #f0b24a;pointer-events:none}
.grow{padding:10px 0;border-bottom:1px solid var(--border)}
.grow1,.grow2{display:flex;gap:6px;align-items:center}.grow2{margin-top:6px}
.grow input,.grow select{margin:0;padding:10px;min-width:0;border:1px solid #355570;border-radius:9px;background:var(--surface2);color:var(--text);font:inherit;font-size:15px}
.grow input.ico{width:54px;text-align:center;flex:none}.grow1 input:not(.ico){flex:1}.grow2 select{flex:1}.grow2 input{width:70px;flex:none}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="hidden">
  <div class="login-box">
    <h1>🐼 Pandi recetas</h1>
    <p>Entra con la misma cuenta en tus dos móviles para ver los mismos datos.</p>
    <input id="email" type="email" autocomplete="email" placeholder="Correo electrónico">
    <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña (mínimo 6 caracteres)">
    <div class="row">
      <button class="btn" id="btnSignIn" type="button">Entrar</button>
      <button class="btn secondary" id="btnSignUp" type="button">Crear cuenta</button>
    </div>
    <div class="notice" id="loginMsg"></div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <button class="btn secondary" id="cloudBtn" type="button" title="Estado de la nube" aria-label="Estado de la nube">☁️</button>
    <h1>🐼 Pandi recetas</h1>
    <button class="btn secondary" id="optBtn" type="button" title="Opciones" aria-label="Opciones">⚙️</button>
  </header>
  <main>
    <section class="tab active" id="tab-menu">
      <h2>📅 Menú semanal</h2>
      <div class="weeknav"><button class="btn secondary" id="weekPrev" type="button" aria-label="Semana anterior">◀</button><button class="weeklabel" id="weekLabel" type="button"></button><button class="btn secondary" id="weekNext" type="button" aria-label="Semana siguiente">▶</button></div>
      <div class="chips" style="margin:10px 0 4px"><button class="chip" id="mFill" type="button">✨ Rellenar huecos</button><button class="chip" id="mCopy" type="button">📋 Copiar semana anterior</button><button class="chip" id="mShare" type="button">📤 Compartir menú</button><button class="chip" id="mClear" type="button">🗑️ Vaciar</button></div>
      <div class="notice" id="menuMsg"></div>
      <div id="menuDays"></div>
    </section>
    <section class="tab" id="tab-recipes">
      <div class="sheet-top"><h2>Recetas</h2><button class="btn" id="btnNewRecipe" type="button">＋ Nueva</button></div>
      <div class="tools"><input id="recipeSearch" type="search" placeholder="Buscar por nombre, ingrediente o categoría…" autocomplete="off"></div>
      <div class="chips" style="margin:2px 0 8px"><button class="chip" id="favFilter" type="button">⭐ Favoritas</button><button class="chip" id="sortBtn" type="button">↕️ A–Z</button></div>
      <div class="count" id="recipeCount"></div>
      <div id="recipeList"></div>
    </section>
    <section class="tab" id="tab-shop">
      <h2>🛒 Compra</h2>
      <div class="weeknav"><button class="btn secondary" id="shopPrev" type="button" aria-label="Semana anterior">◀</button><button class="weeklabel" id="shopLabel" type="button"></button><button class="btn secondary" id="shopNext" type="button" aria-label="Semana siguiente">▶</button></div>
      <div class="noterow"><input id="shopAdd" maxlength="60" placeholder="Añadir a la lista (ej. papel de cocina)"><button class="btn" id="shopAddBtn" type="button">＋</button></div>
      <div class="chips" style="margin:6px 0"><button class="chip" id="shopShare" type="button">📤 Compartir lista</button><button class="chip" id="shopStock" type="button">🏠 Guardar comprados en casa</button><button class="chip" id="shopUncheck" type="button">↩️ Desmarcar todo</button><button class="chip" id="shopGroup" type="button"></button></div>
      <div class="notice" id="shopMsg"></div>
      <div id="shopProg"></div>
      <div id="shopList"></div>
    </section>
    <section class="tab" id="tab-pantry">
      <div class="sheet-top"><h2>Despensa</h2><button class="btn" id="btnNewPantry" type="button">＋ Añadir</button></div>
      <div class="loc4" id="locBar"></div>
      <div class="tools" style="margin-top:10px"><input id="pantrySearch" type="search" placeholder="Buscar en casa…" autocomplete="off"></div>
      <div class="chips" style="margin:2px 0 8px"><button class="chip" id="pantrySort" type="button"></button><button class="chip" id="pantryCook" type="button">🍳 Cocinar con lo que tengo</button></div>
      <div id="pantryAlert"></div>
      <div class="count" id="pantryCount"></div>
      <div id="pantryList"></div>
    </section>
    <section class="tab" id="tab-stats">
      <div class="sheet-top"><h2>📊 Estadísticas</h2><button class="btn secondary" id="btnGoals" type="button">🎯 Objetivos</button></div>
      <div class="weeknav"><button class="btn secondary" id="statsPrev" type="button" aria-label="Semana anterior">◀</button><button class="weeklabel" id="statsLabel" type="button"></button><button class="btn secondary" id="statsNext" type="button" aria-label="Semana siguiente">▶</button></div>
      <div id="statsBody"></div>
    </section>
  </main>
  <nav id="nav">
    <button class="active" data-tab="menu" type="button"><span>📅</span>Menú</button>
    <button data-tab="recipes" type="button"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13.5a3.5 3.5 0 0 1 1.2-6.8 4 4 0 0 1 8.6 0 3.5 3.5 0 0 1 1.2 6.8V19a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/><path d="M6.5 16.5h11"/></svg></span>Recetas</button>
    <button data-tab="shop" type="button"><span>🛒</span>Compra</button>
    <button data-tab="pantry" type="button"><span>🧊</span>Despensa</button>
    <button data-tab="stats" type="button"><span>📊</span>Estadísticas</button>
  </nav>
</div>

<div class="modal" id="cloudModal">
  <div class="sheet">
    <h2>☁️ Estado de la nube</h2>
    <div class="notice" id="who"></div>
    <div id="checks"></div>
    <div class="row">
      <button class="btn secondary" id="btnRecheck" type="button">Comprobar otra vez</button>
      <button class="btn secondary" id="btnSignOut" type="button">Cerrar sesión</button>
      <button class="btn" id="btnCloseCloud" type="button">Cerrar</button>
    </div>
  </div>
</div>

<div class="modal" id="pickModal"><div class="sheet" id="pickBody"></div></div>
<div class="modal" id="pModal"><div class="sheet" id="pBody"></div></div>
<div class="modal" id="gModal"><div class="sheet" id="gBody"></div></div>
<div class="modal" id="optModal"><div class="sheet" id="optBody"></div></div>
<div class="modal" id="recipeModal"><div class="sheet" id="recipeBody"></div></div>

<script>
/* ============ 1. CONFIGURACIÓN ============ */
const SUPABASE_URL = 'https://hgjojgxspclmuwaeenjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LPRAkNBsVLKUZLDfAMD6dQ_kaMErp_2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT_CATS = [
  ['Desayuno','🥞'],['Almuerzo','🍎'],['Comida','🍽️'],['Merienda','🥪'],['Cena','🌙'],
  ['A la parrilla','🔥'],['A la sartén','🍳'],['Al horno','♨️'],['Al vapor','💨'],['Alto en proteínas','💪'],
  ['Aperitivos y entrantes','🥟'],['Arroces','🍚'],['Asiática','🥢'],['Carne blanca','🍗'],['Carne roja','🥩'],
  ['Ensaladas','🥗'],['Fruta','🍎'],['Guarnición','🥔'],['Guisos','🍲'],['Huevos','🥚'],['Legumbres','🫘'],
  ['Marisco','🦐'],['Pasta','🍝'],['Pescado','🐟'],['Pescado azul','🐟'],['Pescado blanco','🐠'],
  ['Postres','🍰'],['Salsas','🥫'],['Sopas','🥣'],['Vegano','🌿'],['Vegetariano','🌱'],['Verduras','🥦']
].map(([name, icon]) => ({ name, icon }));

const MEALS = [['desayuno', 'Desayuno', '🥞'], ['almuerzo', 'Almuerzo', '🍎'], ['comida', 'Comida', '🍽️'], ['merienda', 'Merienda', '🥪'], ['cena', 'Cena', '🌙']];
const DAYS = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO', 'DOMINGO'];
const LOCK = MEALS.map(m => m[1]);
const sortCats = list => [...LOCK.map(n => list.find(c => c.name === n)).filter(Boolean), ...list.filter(c => !LOCK.includes(c.name)).sort((a, b) => a.name.localeCompare(b.name, 'es'))];
const DEFAULT_GOALS = [
  { label: 'Vegetales', key: 'Verduras', target: 10, mode: 'min', icon: '🥦' }, { label: 'Fruta', key: 'Fruta', target: 7, mode: 'min', icon: '🍎' },
  { label: 'Legumbres', key: 'Legumbres', target: 2, mode: 'min', icon: '🫘' }, { label: 'Pescado', key: 'Pescado', target: 2, mode: 'min', icon: '🐟' },
  { label: 'Pescado azul', key: 'Pescado azul', target: 1, mode: 'min', icon: '🐟' }, { label: 'Pescado blanco', key: 'Pescado blanco', target: 1, mode: 'min', icon: '🐠' },
  { label: 'Carne blanca', key: 'Carne blanca', target: 2, mode: 'min', icon: '🍗' }, { label: 'Carne roja', key: 'Carne roja', target: 2, mode: 'max', icon: '🥩' },
  { label: 'Huevos', key: 'Huevos', target: 2, mode: 'min', icon: '🥚' }];
const emptyMenu = () => DAYS.map(() => ({}));
const normMenu = m => { const a = Array.isArray(m) ? m : []; return DAYS.map((_, i) => (a[i] && typeof a[i] === 'object') ? a[i] : {}); };

/* ============ 2. CAPA DE DATOS (todo online) ============

   solo llama a estas funciones; así un fallo se arregla en un único sitio. */
const db = {
  user: null,
  async recipes() {
    const { data, error } = await sb.from('recipes').select('*').order('name');
    if (error) throw error;
    return data;
  },
  async categories() {
    const { data, error } = await sb.from('settings').select('categories').maybeSingle();
    if (error) throw error;
    return (data && data.categories) || DEFAULT_CATS;
  },
  async saveCategories(list) {
    const { error } = await sb.from('settings').upsert({ user_id: this.user.id, categories: list }, { onConflict: 'user_id' });
    if (error) throw error;
  },
  async uploadPhoto(blob) {
    const path = `${this.user.id}/${crypto.randomUUID()}.jpg`;
    const { error } = await sb.storage.from('recipe-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    return sb.storage.from('recipe-photos').getPublicUrl(path).data.publicUrl;
  },
  async removePhoto(url) {
    const i = (url || '').indexOf('/recipe-photos/');
    if (i >= 0) await sb.storage.from('recipe-photos').remove([decodeURIComponent(url.slice(i + 15))]);
  },
  async saveRecipe(r) {
    const row = { name: r.name, categories: r.categories, servings: r.servings, time: r.time, ingredients: r.ingredients, steps: r.steps, image_url: r.image_url };
    const { error } = r.id ? await sb.from('recipes').update(row).eq('id', r.id) : await sb.from('recipes').insert(row);
    if (error) throw error;
  },
  async allWeeks() {
    const { data, error } = await sb.from('weeks').select('week_start,menu');
    if (error) throw error;
    return data || [];
  },
  async goals() {
    const { data, error } = await sb.from('settings').select('goals').maybeSingle();
    if (error) throw error;
    const g = data && data.goals;
    return Array.isArray(g) ? g : null;
  },
  async saveGoals(list) {
    const { error } = await sb.from('settings').upsert({ user_id: this.user.id, goals: list }, { onConflict: 'user_id' });
    if (error) throw error;
  },
  async pantry() {
    const { data, error } = await sb.from('pantry').select('*');
    if (error) throw error;
    return data;
  },
  async savePantry(it) {
    const row = { name: it.name, quantity: it.quantity, location: it.location, entry_date: it.entry_date || null, expiry_date: it.expiry_date || null };
    const { error } = it.id ? await sb.from('pantry').update(row).eq('id', it.id) : await sb.from('pantry').insert(row);
    if (error) throw error;
  },
  async deletePantry(id) {
    const { error } = await sb.from('pantry').delete().eq('id', id);
    if (error) throw error;
  },
  async addPantry(rows) {
    const { error } = await sb.from('pantry').insert(rows);
    if (error) throw error;
  },
  async shop() {
    const { data, error } = await sb.from('settings').select('shopping_checked').maybeSingle();
    if (error) throw error;
    const v = data && data.shopping_checked;
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  },
  async saveShop(ws, d) {
    const all = await this.shop(); all[ws] = d;
    Object.keys(all).sort().slice(0, -10).forEach(k => delete all[k]);
    const { error } = await sb.from('settings').upsert({ user_id: this.user.id, shopping_checked: all }, { onConflict: 'user_id' });
    if (error) throw error;
  },
  async week(ws) {
    const { data, error } = await sb.from('weeks').select('menu').eq('week_start', ws).maybeSingle();
    if (error) throw error;
    return normMenu(data && data.menu);
  },
  async saveWeek(ws, menu) {
    const { error } = await sb.from('weeks').upsert({ user_id: this.user.id, week_start: ws, menu }, { onConflict: 'user_id,week_start' });
    if (error) throw error;
  },
  async cookCounts() {
    const { data, error } = await sb.from('weeks').select('menu');
    if (error) throw error;
    const n = {};
    (data || []).forEach(w => normMenu(w.menu).forEach(d => MEALS.forEach(([k]) => { if (d[k] && !String(d[k]).startsWith('~')) n[d[k]] = (n[d[k]] || 0) + 1; })));
    return n;
  },
  async setFavorite(id, favorite) {
    const { error } = await sb.from('recipes').update({ favorite }).eq('id', id);
    if (error) throw error;
  },
  async duplicateRecipe(r) {
    let image_url = null;
    const i = (r.image_url || '').indexOf('/recipe-photos/');
    if (i >= 0) {
      const to = `${this.user.id}/${crypto.randomUUID()}.jpg`;
      const { error } = await sb.storage.from('recipe-photos').copy(decodeURIComponent(r.image_url.slice(i + 15)), to);
      if (!error) image_url = sb.storage.from('recipe-photos').getPublicUrl(to).data.publicUrl;
    }
    const { error } = await sb.from('recipes').insert({ name: r.name + ' (copia)', categories: r.categories, servings: r.servings, time: r.time, ingredients: r.ingredients, steps: r.steps, image_url });
    if (error) throw error;
  },
  async importRecipes(rows) {
    const { error } = await sb.from('recipes').insert(rows);
    if (error) throw error;
  },
  async setRecipeCategories(id, categories) {
    const { error } = await sb.from('recipes').update({ categories }).eq('id', id);
    if (error) throw error;
  },
  async deleteRecipe(r) {
    const { error } = await sb.from('recipes').delete().eq('id', r.id);
    if (error) throw error;
    if (r.image_url) await this.removePhoto(r.image_url).catch(() => {});
  },
  /* Comprueba que cada pieza responde. Devuelve [{name, ok, detail}] */
  async diagnose() {
    const out = [];
    const add = (name, ok, detail = '') => out.push({ name, ok, detail });
    for (const t of ['recipes', 'weeks', 'pantry', 'settings']) {
      const { error } = await sb.from(t).select('*', { count: 'exact', head: true });
      add(`Tabla ${t}`, !error, error ? error.message : 'lectura correcta');
    }
    const fv = await sb.from('recipes').select('favorite', { head: true, count: 'exact' });
    add('Columna favoritas', !fv.error, fv.error ? 'Falta ejecutar el SQL de favoritas' : 'correcta');
    const pl = await sb.from('pantry').select('location', { head: true, count: 'exact' });
    add('Columna ubicación (despensa)', !pl.error, pl.error ? 'Falta ejecutar el SQL de ubicaciones' : 'correcta');
    const w = await sb.from('settings').upsert({ user_id: this.user.id }, { onConflict: 'user_id' });
    add('Guardar datos', !w.error, w.error ? w.error.message : 'escritura correcta');
    const st = await sb.storage.from('recipe-photos').list('', { limit: 1 });
    add('Almacén de fotos', !st.error, st.error ? st.error.message : 'accesible');
    return out;
  }
};

function setLoginMsg(t, err) { const m = $('loginMsg'); m.textContent = t; m.className = 'notice' + (err ? ' err' : ''); }
function translateAuthError(m = '') {
  if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Pulsa Entrar.';
  if (/password/i.test(m) && /6/.test(m)) return 'La contraseña necesita al menos 6 caracteres.';
  if (/confirm/i.test(m)) return 'Confirma tu correo con el enlace que te hemos enviado y vuelve a entrar.';
  return m;
}
async function signIn() {
  setLoginMsg('Entrando…');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) setLoginMsg(translateAuthError(error.message), true);
}
async function signUp() {
  setLoginMsg('Creando cuenta…');
  const { data, error } = await sb.auth.signUp({ email: $('email').value.trim(), password: $('password').value });
  if (error) return setLoginMsg(translateAuthError(error.message), true);

/* ---- Recetas ---- */
let RECIPES = [], CATS = [], COUNTS = {};
const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const icon = n => (CATS.find(c => c.name === n) || {}).icon || '🏷️';
const catLabel = n => icon(n) + ' ' + n;

async function loadRecipes() {
  try { [RECIPES, CATS, COUNTS] = await Promise.all([db.recipes(), db.categories(), db.cookCounts().catch(() => ({}))]); }
  catch (e) { $('recipeList').innerHTML = `<div class="empty">No se pudieron cargar las recetas: ${esc(e.message)}</div>`; return; }
  renderRecipes();
}
let favOnly = false, sortMode = 'az';
function renderRecipes() {
  const q = norm($('recipeSearch').value).split(/\s+/).filter(Boolean);
  const list = RECIPES.filter(r => (!favOnly || r.favorite) &&
    q.every(w => norm([r.name, r.ingredients, (r.categories || []).join(' ')].join(' ')).includes(w)));
  const byName = (a, b) => a.name.localeCompare(b.name, 'es');
  list.sort(sortMode === 'new' ? (a, b) => String(b.created_at).localeCompare(String(a.created_at))
    : sortMode === 'cooked' ? (a, b) => (COUNTS[b.id] || 0) - (COUNTS[a.id] || 0) || byName(a, b) : byName);
  $('favFilter').classList.toggle('on', favOnly);
  $('sortBtn').textContent = { az: '↕️ A–Z', new: '↕️ Recientes', cooked: '↕️ Más cocinadas' }[sortMode];
  $('recipeCount').textContent = `${list.length} receta${list.length === 1 ? '' : 's'} · ${RECIPES.length} en total`;
  $('recipeList').innerHTML = list.length ? list.map(r => `
    <div class="rcard" data-id="${r.id}">
      <button class="star" data-fav="${r.id}" aria-label="Favorita">${r.favorite ? '⭐' : '☆'}</button>
      <div class="thumb">${r.image_url ? `<img src="${esc(r.image_url)}" alt="" loading="lazy">` : '🥘'}</div>
      <div><h3>${esc(r.name)}</h3><small>👥 ${esc(r.servings || '—')} · ⏱️ ${esc(r.time || '—')}${COUNTS[r.id] ? ` · 🍳 ${COUNTS[r.id]}` : ''}</small>
      <div class="tags">${esc((r.categories || []).slice(0, 4).map(catLabel).join(' · '))}</div></div></div>`).join('')
    : `<div class="empty">${RECIPES.length ? 'No hay recetas con esos filtros.' : 'Todavía no tienes recetas. Pulsa ＋ Nueva para crear la primera.'}</div>`;
}
async function toggleFav(id) {
  const r = RECIPES.find(x => x.id === id); if (!r) return;
  const v = !r.favorite; r.favorite = v; renderRecipes();
  try { await db.setFavorite(id, v); }
  catch (e) { r.favorite = !v; renderRecipes(); alert('No se pudo guardar el favorito: ' + e.message); }
}
const openModal = html => { $('recipeBody').innerHTML = html; $('recipeModal').classList.add('show'); };
const closeRecipeModal = () => $('recipeModal').classList.remove('show');
const lines = t => String(t || '').split('\n').map(x => x.trim()).filter(Boolean);

function showRecipe(id) {
  const r = RECIPES.find(x => x.id === id); if (!r) return;
  openModal(`<div class="sheet-top"><h2>${esc(r.name)}</h2><div class="btns2"><button class="btn secondary" data-act="fav" data-id="${r.id}">${r.favorite ? '⭐' : '☆'}</button><button class="btn secondary" data-act="close">Cerrar</button></div></div>
    ${r.image_url ? `<div class="detail-photo"><img src="${esc(r.image_url)}" alt=""></div>` : ''}
    <div class="notice">👥 ${esc(r.servings || '—')} raciones · ⏱️ ${esc(r.time || '—')}</div>
    <div class="notice">${esc((r.categories || []).map(catLabel).join(' · '))}</div>
    <h3>Ingredientes</h3>${lines(r.ingredients).map(x => `<div class="ing">${esc(x)}</div>`).join('') || '<div class="notice">Sin ingredientes.</div>'}
    <h3>Preparación</h3>${r.steps ? `<div class="step">${esc(r.steps)}</div>` : '<div class="notice">Sin pasos.</div>'}
    <div class="row"><button class="btn secondary" data-act="share" data-id="${r.id}">📤 Compartir</button><button class="btn secondary" data-act="dup" data-id="${r.id}">📄 Duplicar</button></div>
    <div class="row"><button class="btn danger" data-act="delete" data-id="${r.id}">Eliminar</button><button class="btn" data-act="edit" data-id="${r.id}">Editar</button></div>
    <div class="notice" id="recipeMsg"></div>`);
}
async function dupRecipe(id) {
  const r = RECIPES.find(x => x.id === id); if (!r) return;
  const m = $('recipeMsg'); m.className = 'notice'; m.textContent = 'Duplicando…';
  try {
    await db.duplicateRecipe(r); await loadRecipes();
    const c = RECIPES.filter(x => x.name === r.name + ' (copia)').sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0];
    if (c) editRecipe(c.id); else closeRecipeModal();
  } catch (e) { m.className = 'notice err'; m.textContent = 'No se pudo duplicar: ' + e.message; }
}
async function shareRecipe(id) {
  const r = RECIPES.find(x => x.id === id); if (!r) return; const m = $('recipeMsg');
  const text = `*${r.name}*\n${(r.categories || []).join(' · ')}\n👥 ${r.servings || '—'} raciones · ⏱️ ${r.time || '—'}\n\n*Ingredientes*\n${lines(r.ingredients).map(x => '• ' + x).join('\n')}\n\n*Preparación*\n${r.steps || ''}`;
  try {
    if (navigator.share) await navigator.share({ title: r.name, text });
    else { await navigator.clipboard.writeText(text); m.className = 'notice'; m.textContent = 'Receta copiada. Pégala donde quieras.'; }
  } catch (e) { if (e.name !== 'AbortError') { m.className = 'notice err'; m.textContent = 'No se pudo compartir: ' + e.message; } }
}

let draft = null;
function editRecipe(id) {
  const r = RECIPES.find(x => x.id === id) || { name: '', categories: [], servings: 2, time: '', ingredients: '', steps: '', image_url: null };
  draft = { id: r.id || null, cats: new Set(r.categories || []), file: null, oldUrl: r.image_url, image_url: r.image_url, removePhoto: false };
  openModal(`<div class="editbar"><div class="sheet-top"><h2>${id ? 'Editar receta' : 'Nueva receta'}</h2>
      <div class="btns"><button class="btn secondary" data-act="close">Cancelar</button><button class="btn" id="btnSaveRecipe" data-act="save">Guardar</button></div></div>
      <div class="notice" id="recipeMsg"></div></div>
    <div class="field"><label>Nombre</label><input id="fName" value="${esc(r.name)}"></div>
    <div class="field"><label>Foto</label><div class="photo-prev" id="photoPrev"></div>
      <input id="fPhoto" type="file" accept="image/*">
      <button class="btn secondary" id="btnNoPhoto" type="button" style="margin-top:6px">Quitar foto</button></div>
    <div class="field"><label>Categorías</label><div class="chips" id="fCats"></div></div>
    <div class="field"><label>Raciones</label><input id="fServ" type="number" min="1" value="${esc(r.servings || 2)}"></div>
    <div class="field"><label>Tiempo</label><input id="fTime" value="${esc(r.time)}" placeholder="Ej.: 30 min"></div>
    <div class="field"><label>Ingredientes (uno por línea)</label><textarea id="fIngs">${esc(r.ingredients)}</textarea></div>
    <div class="field"><label>Preparación</label><textarea id="fSteps">${esc(r.steps)}</textarea></div>
    `);
  drawChips(); drawPhoto();
}
function drawChips() {
  $('fCats').innerHTML = sortCats(CATS)
    .map(c => `<button type="button" class="chip${draft.cats.has(c.name) ? ' on' : ''}" data-cat="${esc(c.name)}">${esc(catLabel(c.name))}</button>`).join('') +
    '<button type="button" class="chip add" data-act="newcat">＋ Nueva categoría</button>';
}
function drawPhoto() {
  const url = draft.file ? URL.createObjectURL(draft.file) : (draft.removePhoto ? null : draft.image_url);
  $('photoPrev').innerHTML = url ? `<img src="${esc(url)}" alt="">` : 'Sin foto';
  $('btnNoPhoto').classList.toggle('hidden', !url);
}
async function newCategory() {
  const name = (prompt('Nombre de la nueva categoría') || '').trim(); if (!name) return;
  let c = CATS.find(x => norm(x.name) === norm(name));
  if (!c) {
    c = { name, icon: (prompt('Icono (un emoji)', '🏷️') || '').trim() || '🏷️' };
    try { await db.saveCategories([...CATS, c]); CATS.push(c); }
    catch (e) { return ($('recipeMsg').textContent = 'No se pudo guardar la categoría: ' + e.message); }
  }
  draft.cats.add(c.name); drawChips();
}
async function saveRecipe() {
  const msg = $('recipeMsg'), btn = $('btnSaveRecipe'), name = $('fName').value.trim();
  msg.className = 'notice err';
  if (!name) return (msg.textContent = 'Escribe un nombre para la receta.');
  btn.disabled = true; msg.className = 'notice'; msg.textContent = 'Guardando…';
  try {
    let url = draft.removePhoto ? null : draft.image_url;
    if (draft.file) url = await db.uploadPhoto(await resizeImage(draft.file));
    await db.saveRecipe({
      id: draft.id, name, categories: [...draft.cats], servings: +$('fServ').value || 2, time: $('fTime').value.trim(),
      ingredients: lines($('fIngs').value).join('\n'), steps: $('fSteps').value.trim(), image_url: url
    });
    if (draft.oldUrl && draft.oldUrl !== url) await db.removePhoto(draft.oldUrl).catch(() => {});
    closeRecipeModal(); await loadRecipes();
  } catch (e) { btn.disabled = false; msg.className = 'notice err'; msg.textContent = 'No se pudo guardar: ' + e.message; }
}
async function deleteRecipe(id) {
  const r = RECIPES.find(x => x.id === id); if (!r || !confirm(`¿Eliminar "${r.name}"?`)) return;
  try { await db.deleteRecipe(r); closeRecipeModal(); await loadRecipes(); }
  catch (e) { const m = $('recipeMsg'); m.className = 'notice err'; m.textContent = 'No se pudo eliminar: ' + e.message; }
}
function resizeImage(file) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la foto')), 'image/jpeg', .8);
    };
    im.onerror = () => rej(new Error('La foto no es válida'));
    im.src = URL.createObjectURL(file);
  });
}
$('btnNewRecipe').onclick = () => editRecipe(null);
$('recipeSearch').oninput = renderRecipes;
$('recipeList').onclick = e => {
  const st = e.target.closest('.star'); if (st) return toggleFav(st.dataset.fav);
  const c = e.target.closest('.rcard'); if (c) showRecipe(c.dataset.id);
};
$('favFilter').onclick = () => { favOnly = !favOnly; renderRecipes(); };
$('sortBtn').onclick = () => { sortMode = { az: 'new', new: 'cooked', cooked: 'az' }[sortMode]; renderRecipes(); };
$('recipeBody').addEventListener('change', e => {
  if (e.target.id === 'fPhoto' && e.target.files[0]) { draft.file = e.target.files[0]; draft.removePhoto = false; drawPhoto(); }
});
$('recipeBody').addEventListener('click', e => {
  const chip = e.target.closest('[data-cat]');
  if (chip) { const n = chip.dataset.cat; draft.cats.has(n) ? draft.cats.delete(n) : draft.cats.add(n); return drawChips(); }
  if (e.target.id === 'btnNoPhoto') { draft.file = null; draft.removePhoto = true; return drawPhoto(); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  ({ close: closeRecipeModal, save: saveRecipe, newcat: newCategory,
     edit: () => editRecipe(b.dataset.id), delete: () => deleteRecipe(b.dataset.id),
     fav: () => toggleFav(b.dataset.id).then(() => showRecipe(b.dataset.id)), dup: () => dupRecipe(b.dataset.id), share: () => shareRecipe(b.dataset.id) })[b.dataset.act]();
});

async function runDiagnosis() {
  $('who').textContent = 'Sesión: ' + db.user.email;

function parseCsv(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split('\n')[0], d = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function importCsv(file) {
  try {
    const rows = parseCsv(await file.text());
    if (rows.length < 2) return optMsg('El archivo está vacío.');
    const h = rows[0].map(norm), g = (r, n) => { const i = h.indexOf(n); return i < 0 ? '' : (r[i] || '').trim(); };
    if (h.indexOf('nombre') < 0) return optMsg('No encuentro la columna "Nombre".');
    const have = new Set(RECIPES.map(r => norm(r.name))), out = [], newCats = []; let skipped = 0;
    for (const r of rows.slice(1)) {
      const name = g(r, 'nombre'); if (!name) continue;
      if (have.has(norm(name))) { skipped++; continue; } have.add(norm(name));
      const cats = g(r, 'categorias').split(',').map(x => x.trim()).filter(Boolean).map(x => {
        const c = [...CATS, ...newCats].find(k => norm(k.name) === norm(x));
        if (c) return c.name; newCats.push({ name: x, icon: '🏷️' }); return x;
      });
      const row = { name, categories: [...new Set(cats)], servings: +g(r, 'raciones') || 2, time: g(r, 'tiempo'), ingredients: g(r, 'ingredientes'), steps: g(r, 'preparacion') };
      if (['si', '1', 'true'].includes(norm(g(r, 'favorita')))) row.favorite = true;
      out.push(row);
    }
    if (!out.length) return optMsg(skipped ? 'Todas las recetas del archivo ya existen.' : 'No hay recetas que importar.');
    if (!confirm(`Se añadirán ${out.length} receta${out.length === 1 ? '' : 's'}${skipped ? ` (${skipped} ya existen y se saltan)` : ''}. ¿Continuar?`)) return;
    if (newCats.length) await db.saveCategories([...CATS, ...newCats]);
    await db.importRecipes(out); await loadRecipes(); renderOptions();
    optMsg(`Importadas ${out.length} recetas.`, true);
  } catch (e) { optMsg('No se pudo importar: ' + e.message); }
}

async function fillGaps() {
  const isRec = x => x && !String(x).startsWith('~');
  let last = new Set();
  try { last = new Set((await db.week(ymd(addDays(parseYmd(WS), -7)))).flatMap(d => MEALS.map(([k]) => d[k])).filter(isRec)); } catch (e) {}
  const used = new Set(MENU.flatMap(d => MEALS.map(([k]) => d[k]).filter(isRec))); let n = 0;
  MENU.forEach(d => MEALS.forEach(([k, label]) => {
    if (d[k]) return;
    const cand = RECIPES.filter(r => (r.categories || []).includes(label));
    const tiers = [cand.filter(r => !used.has(r.id) && !last.has(r.id)), cand.filter(r => !used.has(r.id)), cand];
    const base = tiers.find(t => t.length) || []; if (!base.length) return;
    const cnt = weekCounts(MENU).cats;
    const wt = r => { let w = r.favorite ? 2 : 1; for (const g of GOALS) { if (!(r.categories || []).includes(g.key)) continue; const c = cnt[g.key] || 0; if (g.mode === 'min' && c < g.target) w += 3; if (g.mode === 'max' && c >= g.target) w = 0; } return w; };
    let pool = base.map(r => [r, wt(r)]).filter(x => x[1] > 0); if (!pool.length) pool = base.map(r => [r, 1]);
    let x = Math.random() * pool.reduce((a, y) => a + y[1], 0), r = pool[pool.length - 1][0];
    for (const [rr, w] of pool) { x -= w; if (x <= 0) { r = rr; break; } }
    d[k] = r.id; used.add(r.id); n++;
  }));
  renderMenu(); if (n) persistWeek();
  menuMsg(n ? `Se han rellenado ${n} hueco${n === 1 ? '' : 's'}, evitando repetir, priorizando favoritas y acercándose a tus objetivos. Toca cualquiera para cambiarla.` : 'No hay huecos que rellenar con las categorías que tienes.');
}

    .sort((a, b) => b.urgent.length - a.urgent.length || b.hit.length / b.total - a.hit.length / a.total || b.hit.length - a.hit.length).slice(0, 20);
  openP(`<div class="editbar"><div class="sheet-top"><h2>🍳 Cocinar con lo que tengo</h2><button class="btn secondary" data-pa="close">Cerrar</button></div><div class="notice">Primero las que usan lo que caduca antes.</div></div>` +
    (res.length ? res.map(x => `<button class="pick" data-id="${x.r.id}" type="button"><span class="pthumb">${x.r.image_url ? `<img src="${esc(x.r.image_url)}" alt="" loading="lazy">` : '🥘'}</span><span><b>${esc(x.r.name)}</b>
      <small>Tienes ${x.hit.length} de ${x.total} ingredientes</small>${x.urgent.length ? `<small class="exp warn">⏰ Usa: ${esc(x.urgent.map(u => cap(u.h.n)).join(', '))}</small>` : ''}</span></button>`).join('')
      : '<div class="empty" style="margin-top:12px">Ninguna receta usa lo que tienes apuntado. Prueba a añadir más cosas o a revisar los ingredientes de tus recetas.</div>'));
}
$('locBar').onclick = e => { const b = e.target.closest('[data-loc]'); if (b) { pLoc = b.dataset.loc; renderPantry(); } };
$('pantryAlert').onclick = e => { if (e.target.closest('#pantryWarn')) { pLoc = 'all'; pSort = 'exp'; $('pantrySearch').value = ''; renderPantry(); } };
$('pantryList').onclick = e => { const c = e.target.closest('.pcard'); if (c) editPantry(c.dataset.id); };
$('pantrySearch').oninput = renderPantry;
$('pantrySort').onclick = () => { pSort = { exp: 'az', az: 'new', new: 'exp' }[pSort]; renderPantry(); };
$('pantryCook').onclick = cookIdeas;
$('btnNewPantry').onclick = () => editPantry(null);
$('pBody').addEventListener('click', e => {
  const lc = e.target.closest('[data-ploc]'); if (lc) { pEdit.loc = lc.dataset.ploc; return drawPLoc(); }
  const pk = e.target.closest('.pick'); if (pk) return showRecipe(pk.dataset.id);
  const b = e.target.closest('[data-pa]'); if (!b) return;
  ({ close: () => $('pModal').classList.remove('show'), save: savePantryItem, del: delPantryItem,
     exp: () => { $('pExp').value = b.dataset.days === '0' ? '' : ymd(addDays(new Date(), +b.dataset.days)); } })[b.dataset.pa]();
});

/* ---- Estadísticas y objetivos ---- */
let ALLW = {}, GOALS = DEFAULT_GOALS.map(g => ({ ...g })), statsCat = '', statsRange = 8, gDraft = [];
function weekCounts(menu) {
  const rm = new Map(RECIPES.map(r => [r.id, r])), cats = {}, ids = new Set(); let meals = 0, notes = 0;
  menu.forEach(d => MEALS.forEach(([k]) => {
    const id = d[k]; if (!id) return;
    if (String(id).startsWith('~')) { notes++; return; }
    const r = rm.get(id); if (!r) return;
    meals++; ids.add(id); (r.categories || []).forEach(c => cats[c] = (cats[c] || 0) + 1);
  }));
  return { cats, ids, meals, notes };
}
const goalOk = (g, n) => g.mode === 'min' ? n >= g.target : n <= g.target;
async function loadStats() {
  try {
    const [rows, g] = await Promise.all([db.allWeeks(), db.goals()]);
    ALLW = {}; rows.forEach(r => ALLW[r.week_start] = normMenu(r.menu)); GOALS = g || DEFAULT_GOALS.map(x => ({ ...x }));
  } catch (e) { $('statsBody').innerHTML = `<div class="empty">No se pudieron cargar las estadísticas: ${esc(e.message)}</div>`; return; }
  renderStats();
}
function renderStats() {
  const box = $('statsBody'); if (!box) return;
  ALLW[WS] = MENU;
  const wc = weekCounts(MENU), soon = PANTRY.filter(p => p.expiry_date && daysTo(p.expiry_date) <= 3).length;
  const weeksPlanned = Object.values(ALLW).filter(m => weekCounts(m).meals > 0).length;
  let h = '<div class="scards">' + [['Comidas planificadas', `${wc.meals + wc.notes}/35`], ['Recetas distintas', wc.ids.size], ['Recetas guardadas', RECIPES.length],
    ['Semanas planificadas', weeksPlanned], ['Productos en casa', PANTRY.length], ['Caducan en 3 días', soon]].map(([l, v]) => `<div class="scard"><strong>${v}</strong><span>${l}</span></div>`).join('') + '</div>';

  /* objetivos */
  h += `<div class="ssec">🎯 Objetivos de la semana<small>${GOALS.filter(g => goalOk(g, wc.cats[g.key] || 0)).length} de ${GOALS.length} cumplidos</small></div>`;
  h += GOALS.length ? GOALS.map(g => {
    const n = wc.cats[g.key] || 0, ok = goalOk(g, n), pct = g.target ? Math.min(100, Math.round(n / g.target * 100)) : (n ? 100 : 0);
    const cls = ok ? 'ok' : g.mode === 'max' ? 'bad' : 'warn';
    const note = g.mode === 'min' ? (ok ? `Mínimo ${g.target} a la semana` : `Mínimo ${g.target} · te faltan ${g.target - n}`) : (ok ? `Máximo ${g.target} a la semana` : `Máximo ${g.target} · te pasas en ${n - g.target}`);
    return `<div class="goal ${cls}"><div class="gtop"><span>${esc(g.icon || '🎯')} ${esc(g.label)}</span><span>${n}/${g.target} ${ok ? '✓' : ''}</span></div><div class="progress"><i style="width:${pct}%"></i></div><small>${esc(note)}</small></div>`;
  }).join('') : '<div class="empty">No tienes objetivos. Pulsa 🎯 Objetivos para crear los tuyos.</div>';

  /* racha y cumplimiento */
  if (GOALS.length) {
    const stat = Array.from({ length: 12 }, (_, k) => {
      const ws = ymd(addDays(parseYmd(WS), -7 * k)), c = weekCounts(ALLW[ws] || emptyMenu()), okc = GOALS.filter(g => goalOk(g, c.cats[g.key] || 0)).length;
      return { ws, planned: c.meals > 0, pct: okc / GOALS.length, full: okc === GOALS.length };
    });
    let k0 = stat[0].ws === ymd(mondayOf(new Date())) && !(stat[0].planned && stat[0].full) ? 1 : 0, streak = 0;
    for (let k = k0; k < stat.length && stat[k].planned && stat[k].full; k++) streak++;
    const pl = stat.slice(0, 8).filter(x => x.planned), avg = pl.length ? Math.round(pl.reduce((a, x) => a + x.pct, 0) / pl.length * 100) : null;
    h += `<div class="streak">🔥 Racha: <b>${streak}</b> semana${streak === 1 ? '' : 's'} seguida${streak === 1 ? '' : 's'} cumpliendo todos los objetivos<br>📈 Cumplimiento medio (últimas 8 semanas planificadas): <b>${avg === null ? '—' : avg + '%'}</b></div>`;
  }

  /* balance de la semana */
  const bal = Object.entries(wc.cats).filter(([c]) => !LOCK.includes(c)).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es')), mx = bal.length ? bal[0][1] : 1;
  h += '<div class="ssec">⚖️ Balance de la semana<small>comidas por categoría</small></div>';
  h += bal.length ? bal.map(([c, n]) => `<div class="brow"><span>${esc(catLabel(c))}</span><div class="bar"><i style="width:${Math.round(n / mx * 100)}%"></i></div><b>${n}</b></div>`).join('') : '<div class="empty">Añade recetas al menú de esta semana para ver el balance.</div>';

  /* evolución */
  const names = sortCats(CATS).map(c => c.name).filter(n => !LOCK.includes(n)), sel = statsCat || (GOALS[0] && GOALS[0].key) || names[0] || '';
  const wk = Array.from({ length: statsRange }, (_, i) => ymd(addDays(parseYmd(WS), -7 * (statsRange - 1 - i))));
  const vals = wk.map(ws => weekCounts(ALLW[ws] || emptyMenu()).cats[sel] || 0), goal = GOALS.find(g => g.key === sel), sc = Math.max(...vals, goal ? goal.target : 0, 1);
  h += `<div class="ssec">📈 Evolución<small>por semana</small></div><select class="sel" id="statsCat">${(names.includes(sel) ? names : [sel, ...names]).map(n => `<option value="${esc(n)}"${n === sel ? ' selected' : ''}>${esc(catLabel(n))}</option>`).join('')}</select>
    <div class="chips">${[4, 8, 12].map(n => `<button class="chip${statsRange === n ? ' on' : ''}" data-range="${n}" type="button">${n} semanas</button>`).join('')}</div>
    <div class="chart">${goal ? `<div class="goalline" style="bottom:${17 + Math.round(goal.target / sc * 90)}px" title="Objetivo"></div>` : ''}${wk.map((ws, i) => { const d = parseYmd(ws); return `<div class="barcol"><b>${vals[i] || ''}</b><i style="height:${Math.round(vals[i] / sc * 90)}px"></i><small>${d.getDate()}/${d.getMonth() + 1}</small></div>`; }).join('')}</div>
    ${goal ? `<div class="notice">Línea naranja: tu objetivo (${goal.mode === 'min' ? 'mínimo' : 'máximo'} ${goal.target}).</div>` : ''}`;

  /* recetas más cocinadas y olvidadas */
  const cnt = {}, last = {};
  Object.entries(ALLW).forEach(([ws, m]) => m.forEach(d => MEALS.forEach(([k]) => { const id = d[k]; if (!id || String(id).startsWith('~')) return; cnt[id] = (cnt[id] || 0) + 1; if (!last[id] || ws > last[id]) last[id] = ws; })));
  const item = (r, sub) => `<button class="pick" data-id="${r.id}" type="button"><span class="pthumb">${r.image_url ? `<img src="${esc(r.image_url)}" alt="" loading="lazy">` : '🥘'}</span><span><b>${esc(r.name)}</b><small>${esc(sub)}</small></span></button>`;
  const top = RECIPES.filter(r => cnt[r.id]).sort((a, b) => cnt[b.id] - cnt[a.id] || a.name.localeCompare(b.name, 'es')).slice(0, 5);
  const limit = ymd(addDays(new Date(), -56));
  const old = RECIPES.filter(r => !last[r.id] || last[r.id] < limit).sort((a, b) => (last[a.id] ? 1 : 0) - (last[b.id] ? 1 : 0) || (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || String(last[a.id]).localeCompare(String(last[b.id]))).slice(0, 6);
  h += '<div class="ssec">🏆 Tus más cocinadas</div>' + (top.length ? top.map(r => item(r, `${cnt[r.id]} vez${cnt[r.id] === 1 ? '' : 'es'} en el menú`)).join('') : '<div class="empty">Cuando planifiques semanas, aquí verás tus favoritas de verdad.</div>');
  h += '<div class="ssec">😴 Hace tiempo que no las haces<small>para variar</small></div>' + (old.length ? old.map(r => item(r, last[r.id] ? 'Última vez: ' + fdate(last[r.id]) : 'Nunca la has puesto en el menú')).join('') : '<div class="empty">Estás rotando todas tus recetas. 👏</div>');
  box.innerHTML = h;
}
$('statsBody').addEventListener('click', e => {
  const r = e.target.closest('[data-range]'); if (r) { statsRange = +r.dataset.range; return renderStats(); }
  const pk = e.target.closest('.pick'); if (pk) showRecipe(pk.dataset.id);
});
$('statsBody').addEventListener('change', e => { if (e.target.id === 'statsCat') { statsCat = e.target.value; renderStats(); } });
$('statsPrev').onclick = () => $('weekPrev').click(); $('statsNext').onclick = () => $('weekNext').click(); $('statsLabel').onclick = () => $('weekLabel').click();

/* editor de objetivos */
function readGoals() {
  document.querySelectorAll('#gBody .grow').forEach(row => {
    const g = gDraft[+row.dataset.i]; if (!g) return;
    row.querySelectorAll('[data-f]').forEach(el => { g[el.dataset.f] = el.dataset.f === 'target' ? Math.max(0, +el.value || 0) : el.value.trim(); });
  });
}
function drawGoals() {
  const names = sortCats(CATS).map(c => c.name).filter(n => !LOCK.includes(n));
  $('gBody').innerHTML = `<div class="editbar"><div class="sheet-top"><h2>🎯 Objetivos</h2><div class="btns"><button class="btn secondary" data-ga="close">Cancelar</button><button class="btn" id="btnGSave" data-ga="save">Guardar</button></div></div><div class="notice" id="gMsg"></div></div>
    <div class="notice" style="margin:10px 0 0">Cada objetivo cuenta cuántas comidas de la semana llevan una receta de esa categoría.</div>
    ${gDraft.map((g, i) => `<div class="grow" data-i="${i}"><div class="grow1"><input class="ico" data-f="icon" maxlength="4" value="${esc(g.icon || '')}"><input data-f="label" value="${esc(g.label)}" placeholder="Nombre"><button class="btn secondary" data-ga="del" data-i="${i}" type="button">✕</button></div>
      <div class="grow2"><select data-f="key">${(names.includes(g.key) ? names : [g.key, ...names]).map(n => `<option value="${esc(n)}"${n === g.key ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <select data-f="mode"><option value="min"${g.mode === 'min' ? ' selected' : ''}>Mínimo</option><option value="max"${g.mode === 'max' ? ' selected' : ''}>Máximo</option></select><input type="number" min="0" data-f="target" value="${g.target}"></div></div>`).join('')}
    <div class="row"><button class="btn secondary" data-ga="add" type="button">＋ Añadir objetivo</button><button class="btn secondary" data-ga="reset" type="button">Restaurar por defecto</button></div>`;
}
async function saveGoals() {
  readGoals(); const msg = $('gMsg'), btn = $('btnGSave');
  const list = gDraft.filter(g => g.key).map(g => ({ label: g.label || g.key, key: g.key, target: g.target, mode: g.mode === 'max' ? 'max' : 'min', icon: g.icon || icon(g.key) }));
  btn.disabled = true; msg.className = 'notice'; msg.textContent = 'Guardando…';
  try { await db.saveGoals(list); GOALS = list; $('gModal').classList.remove('show'); renderStats(); }
  catch (e) { btn.disabled = false; msg.className = 'notice err'; msg.textContent = 'No se pudo guardar: ' + e.message; }
}
$('btnGoals').onclick = () => { gDraft = GOALS.map(g => ({ ...g })); drawGoals(); $('gModal').classList.add('show'); };
$('gBody').addEventListener('click', e => {
  const b = e.target.closest('[data-ga]'); if (!b) return; const a = b.dataset.ga;
  if (a === 'close') return $('gModal').classList.remove('show');
  if (a === 'save') return saveGoals();
  readGoals();
  if (a === 'del') gDraft.splice(+b.dataset.i, 1);
  if (a === 'add') gDraft.push({ label: '', key: (sortCats(CATS).map(c => c.name).filter(n => !LOCK.includes(n))[0]) || '', target: 1, mode: 'min', icon: '🎯' });
  if (a === 'reset') { if (!confirm('¿Volver a los objetivos por defecto?')) return; gDraft = DEFAULT_GOALS.map(g => ({ ...g })); }
  drawGoals();
});

/* ============ 5. ARRANQUE ============ */
function onSession(session) {
  db.user = session ? session.user : null;
  $('login').classList.toggle('hidden', !!session);
  $('app').classList.toggle('hidden', !session);
  if (session) { setLoginMsg(''); runDiagnosis().catch(e => { $('cloudBtn').className = 'btn secondary err'; }); loadRecipes().then(loadWeek); loadPantry(); loadStats(); requestAnimationFrame(setHH); }
}
$('btnSignIn').onclick = signIn;
$('btnSignUp').onclick = signUp;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
$('btnSignOut').onclick = () => { $('cloudModal').classList.remove('show'); signOut(); };
$('cloudBtn').onclick = () => { $('cloudModal').classList.add('show'); runDiagnosis(); };
$('btnRecheck').onclick = runDiagnosis;
$('btnCloseCloud').onclick = () => $('cloudModal').classList.remove('show');
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); };

sb.auth.onAuthStateChange((_evt, session) => onSession(session));
sb.auth.getSession().then(({ data }) => onSession(data.session));
</script>
