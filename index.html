<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Recetario</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a65f2b">
<style>
:root{color-scheme:light dark;--bg:#f6f3ee;--surface:#fffdf9;--surface2:#f0ece5;--text:#28251f;--muted:#766f63;--accent:#a65f2b;--accent2:#d58a4b;--border:#ddd5c8;--shadow:0 10px 30px rgba(65,45,25,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b18;--surface:#26231f;--surface2:#322e28;--text:#f4efe7;--muted:#bcb3a6;--accent:#e29a5d;--accent2:#f0b078;--border:#4a433a;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:var(--bg)}
header{padding:22px 18px 14px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:24px;margin:0}.brand small{color:var(--muted)}
.search{margin-top:15px;display:flex;gap:9px}.search input{flex:1;padding:13px 15px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:16px;outline:none}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
main{padding:18px 16px 90px;max-width:900px;margin:auto}.tab{display:none}.tab.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 15px}.section-head h2{margin:0;font-size:20px}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px;box-shadow:var(--shadow);cursor:pointer}.card:active{transform:scale(.99)}.photo{height:115px;border-radius:13px;background:linear-gradient(135deg,var(--surface2),color-mix(in srgb,var(--accent) 15%,var(--surface2)));display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:12px}.card h3{margin:0 0 6px;font-size:17px}.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 96%,transparent);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);z-index:10;padding-bottom:max(7px,env(safe-area-inset-bottom))}nav button{border:0;background:none;color:var(--muted);padding:11px 5px 8px;font-size:12px;font-weight:700;cursor:pointer}nav button.active{color:var(--accent)}nav span{display:block;font-size:21px;margin-bottom:2px}
.week{display:grid;gap:12px}.day{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px}.day h3{margin:0 0 10px;font-size:16px}.meal{display:grid;grid-template-columns:78px 1fr;gap:9px;align-items:center;margin:7px 0}.meal label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.meal select{width:100%;padding:10px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--text)}
.shopping{display:grid;gap:9px}.shop{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);padding:12px 13px;border-radius:13px}.shop input{width:20px;height:20px}.shop .item{flex:1}.shop .qty{color:var(--muted);font-size:13px;text-align:right}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--text);font:inherit}.field textarea{min-height:90px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:15px}.ingredients{display:grid;gap:6px;margin:12px 0}.ing{padding:9px 11px;background:var(--surface2);border-radius:10px}.step{margin:7px 0}.notice{font-size:12px;color:var(--muted);margin-top:10px}.fab{position:fixed;right:18px;bottom:82px;border-radius:999px;width:54px;height:54px;font-size:25px;box-shadow:var(--shadow);z-index:8}
@media(min-width:700px){header{padding-left:max(18px,calc((100vw - 900px)/2 + 16px));padding-right:max(18px,calc((100vw - 900px)/2 + 16px))}.day{padding:16px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div><h1>🍲 Mi Recetario</h1><small>Recetas · menú · compra</small></div><button type="button" class="btn secondary" id="addBtn" onclick="editRecipe(null)">＋ Receta</button></div><div class="search"><input id="search" placeholder="Buscar receta o ingrediente…" autocomplete="off"></div></header>
<main>
<section id="recipesTab" class="tab active"><div class="section-head"><h2>Recetas</h2><span class="count" id="recipeCount"></span></div><div id="recipeGrid" class="grid"></div></section>
<section id="menuTab" class="tab"><div class="section-head"><div><h2>Menú semanal</h2><span class="count">Desayuno, comida y cena</span></div><button class="btn secondary" id="clearMenu">Vaciar</button></div><div id="week" class="week"></div></section>
<section id="shopTab" class="tab"><div class="section-head"><div><h2>🛒 Lista de compra</h2><span class="count" id="shopCount"></span></div><button class="btn secondary" id="clearShop">Desmarcar</button></div><div id="shopping" class="shopping"></div><div class="notice">La lista se calcula automáticamente a partir de las recetas seleccionadas en el menú.</div></section>
</main>
<nav><button type="button" data-tab="recipesTab" class="active"><span>🔎</span>Recetas</button><button type="button" data-tab="menuTab"><span>📅</span>Menú</button><button type="button" data-tab="shopTab"><span>🛒</span>Compra</button></nav>
<button type="button" class="btn fab" id="fab" onclick="editRecipe(null)">＋</button>
<div id="modal" class="modal"><div class="sheet"><div class="section-head"><h2 id="modalTitle">Receta</h2><button class="btn secondary" id="closeModal">Cerrar</button></div><div id="modalBody"></div></div></div>
</div>
<script>
const RECIPE_DATA=[{"id":1,"name":"Arroz con habichuelas","image":null,"category":"Comida, Guisos, Legumbres","servings":4.0,"time":"45 min","ingredients_raw":"1 pimiento verde italiano\n3-4 ajos\n1/2 bolsa de alcachofas congeladas, Tomate rallado\nPimentón\nAgua\n 1 bote Habichuelas","steps":"1. Sofreír verduras. 2. Añadir pimentón y tomate. 3. Cocer con agua y habichuelas."},{"id":2,"name":"Arroz con leche","image":"Base de Datos_Images/Arroz con leche.Imagen.104944.jpg","category":"Postres","servings":4.0,"time":"40 min","ingredients_raw":"Arroz , Harina , Canela , Leche","steps":"Cocer"},{"id":3,"name":"Boniato al horno","image":null,"category":"Cena, Guarnición","servings":2.0,"time":"35 min","ingredients_raw":"","steps":""},{"id":4,"name":"Boniato con carne picada","image":null,"category":"Comida","servings":2.0,"time":"30 min","ingredients_raw":"","steps":""},{"id":5,"name":"Boquerones en vinagre","image":null,"category":"Entrante, Pescado","servings":4.0,"time":"20 min","ingredients_raw":"","steps":""},{"id":6,"name":"Boquerones a la plancha","image":null,"category":"Cena, Pescado","servings":2.0,"time":"15 min","ingredients_raw":"","steps":""},{"id":7,"name":"Verduras Air Fryer","image":null,"category":"Guarnición, Cena","servings":2.0,"time":"10 min","ingredients_raw":"Bolsa verduras congeladas","steps":""}];
const MENU_DATA=[{"desayuno":null,"comida":4,"cena":null},{"desayuno":null,"comida":null,"cena":6},{"desayuno":null,"comida":null,"cena":null},{"desayuno":null,"comida":null,"cena":null},{"desayuno":null,"comida":null,"cena":6},{"desayuno":null,"comida":null,"cena":null},{"desayuno":null,"comida":null,"cena":null}];
const initialRecipes = RECIPE_DATA;
const initialMenu = MENU_DATA;
const days=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'];
let recipes=JSON.parse(localStorage.getItem('recetario_recipes')||'null')||initialRecipes;
let menu=JSON.parse(localStorage.getItem('recetario_menu')||'null')||initialMenu;
let checked=JSON.parse(localStorage.getItem('recetario_checked')||'{}');
const save=()=>{localStorage.setItem('recetario_recipes',JSON.stringify(recipes));localStorage.setItem('recetario_menu',JSON.stringify(menu));localStorage.setItem('recetario_checked',JSON.stringify(checked));};
const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function parseIngredients(raw){if(!raw)return []; let t=raw.replace(/\r/g,'').replace(/\s*,\s*/g,'\n'); return t.split(/\n+/).map(x=>x.trim()).filter(Boolean);}
function renderRecipes(){const q=norm(document.getElementById('search').value);let arr=recipes.filter(r=>{if(!q)return true;const hay=norm([r.name,r.category,r.ingredients_raw].join(' '));return q.split(/\s+/).every(w=>hay.includes(w));});document.getElementById('recipeCount').textContent=`${arr.length} receta${arr.length===1?'':'s'}`;const grid=document.getElementById('recipeGrid');if(!arr.length){grid.innerHTML='<div class="empty">No encuentro recetas con esa búsqueda.</div>';return}grid.innerHTML=arr.map(r=>`<article class="card" data-id="${r.id}"><div class="photo">${r.image?'🍽️':'🥘'}</div><h3>${esc(r.name)}</h3><div class="meta"><span>👥 ${r.servings||'—'}</span><span>⏱️ ${esc(r.time||'—')}</span></div><div class="tags">${String(r.category||'').split(',').filter(Boolean).slice(0,4).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join('')}</div></article>`).join('');grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openRecipe(+c.dataset.id));}
function renderMenu(){document.getElementById('week').innerHTML=days.map((d,i)=>{const m=menu[i]||{};return `<div class="day"><h3>${d}</h3>${['desayuno','comida','cena'].map(meal=>`<div class="meal"><label>${meal}</label><select data-day="${i}" data-meal="${meal}"><option value="">— Seleccionar receta —</option>${recipes.map(r=>`<option value="${r.id}" ${String(m[meal]||'')===String(r.id)?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>`).join('')}</div>`}).join('');document.querySelectorAll('select[data-day]').forEach(s=>s.onchange=()=>{menu[+s.dataset.day][s.dataset.meal]=s.value?+s.value:null;save();renderShopping();});}
function renderShopping(){const totals={};menu.forEach(d=>['desayuno','comida','cena'].forEach(meal=>{const r=recipes.find(x=>x.id==d[meal]);if(!r)return;parseIngredients(r.ingredients_raw).forEach(x=>{const key=norm(x);totals[key]??={name:x,qty:0,raw:x};const m=x.match(/^([0-9]+(?:[.,][0-9]+)?(?:\s*[-–]\s*[0-9]+(?:[.,][0-9]+)?)?)\s*(.*)$/);if(m){totals[key].qty++;totals[key].name=m[2].trim();totals[key].raw=x}else{totals[key].qty++;totals[key].name=x}})}));const arr=Object.entries(totals).map(([key,v])=>({key,...v})).sort((a,b)=>a.name.localeCompare(b.name,'es'));document.getElementById('shopCount').textContent=`${arr.length} ingrediente${arr.length===1?'':'s'}`;const box=document.getElementById('shopping');if(!arr.length){box.innerHTML='<div class="empty">Selecciona recetas en el menú semanal y aquí aparecerá la lista de compra.</div>';return}box.innerHTML=arr.map(x=>`<label class="shop"><input type="checkbox" data-key="${escAttr(x.key)}" ${checked[x.key]?'checked':''}><span class="item">${esc(x.name)}</span><span class="qty">${x.qty>1?`× ${x.qty}`:''}</span></label>`).join('');box.querySelectorAll('input').forEach(c=>c.onchange=()=>{checked[c.dataset.key]=c.checked;save();});}
function openRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;document.getElementById('modalTitle').textContent=r.name;const ings=parseIngredients(r.ingredients_raw);document.getElementById('modalBody').innerHTML=`<div class="meta"><span>👥 ${r.servings||'—'} raciones</span><span>⏱️ ${esc(r.time||'—')}</span><span>🏷️ ${esc(r.category||'')}</span></div><h3>Ingredientes</h3><div class="ingredients">${ings.length?ings.map(x=>`<div class="ing">${esc(x)}</div>`).join(''):'<div class="empty">Esta receta todavía no tiene ingredientes.</div>'}</div><h3>Preparación</h3><div>${r.steps?esc(r.steps).split(/\n/).map(x=>`<div class="step">${x}</div>`).join(''):'<div class="empty">Todavía no hay pasos de preparación.</div>'}</div><div class="actions"><button class="btn secondary" onclick="editRecipe(${id})">Editar</button></div>`;document.getElementById('modal').classList.add('show');}
function editRecipe(id){const r=recipes.find(x=>x.id===id)||{id:null,name:'',category:'',servings:2,time:'',ingredients_raw:'',steps:''};document.getElementById('modalTitle').textContent=id?'Editar receta':'Nueva receta';document.getElementById('modalBody').innerHTML=`<div class="field"><label>Nombre</label><input id="fName" value="${escAttr(r.name)}"></div><div class="field"><label>Categorías (separadas por coma)</label><input id="fCat" value="${escAttr(r.category)}"></div><div class="field"><label>Raciones</label><input id="fServ" type="number" min="1" value="${r.servings||2}"></div><div class="field"><label>Tiempo</label><input id="fTime" value="${escAttr(r.time)}"></div><div class="field"><label>Ingredientes (uno por línea)</label><textarea id="fIng">${esc(r.ingredients_raw)}</textarea></div><div class="field"><label>Preparación</label><textarea id="fSteps">${esc(r.steps)}</textarea></div><div class="actions"><button class="btn secondary" id="cancelEdit">Cancelar</button><button class="btn" id="saveEdit">Guardar</button></div>`;document.getElementById('cancelEdit').onclick=()=>closeModal();document.getElementById('saveEdit').onclick=()=>{const obj={id:id||Math.max(0,...recipes.map(x=>x.id))+1,name:document.getElementById('fName').value.trim(),category:document.getElementById('fCat').value.trim(),servings:+document.getElementById('fServ').value||2,time:document.getElementById('fTime').value.trim(),ingredients_raw:document.getElementById('fIng').value.trim(),steps:document.getElementById('fSteps').value.trim(),image:null};if(!obj.name)return alert('Escribe un nombre');if(id)recipes=recipes.map(x=>x.id===id?obj:x);else recipes.push(obj);save();closeModal();renderRecipes();renderMenu();renderShopping();};}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}
document.getElementById('search').oninput=renderRecipes;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('clearMenu').onclick=()=>{menu=days.map(()=>({}));save();renderMenu();renderShopping()};document.getElementById('clearShop').onclick=()=>{checked={};save();renderShopping()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active');});
renderRecipes();renderMenu();renderShopping();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js?v=2").catch(()=>{}));}</script>

</body></html>
