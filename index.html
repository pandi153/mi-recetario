<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b4f3a">
<link rel="manifest" href="manifest.json">
<title>Mi Recetario</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f7f4ef;color:#29231f}
header{position:sticky;top:0;background:#fff;padding:16px;z-index:5;border-bottom:1px solid #ddd}
h1{margin:0 0 10px;font-size:24px}.search{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}
main{padding:16px 16px 100px;max-width:800px;margin:auto}.tab{display:none}.tab.active{display:block}
.grid{display:grid;gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px}
.card h3{margin:0 0 6px}.muted{color:#777;font-size:14px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:11px 15px;font-size:15px;background:#6b4f3a;color:#fff;cursor:pointer}
button.secondary{background:#eee;color:#29231f}.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:50%;font-size:28px;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:9}
nav button{flex:1;border-radius:0;background:#fff;color:#555;padding:12px 5px}.nav-active{color:#6b4f3a;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:18px;overflow:auto}.modal.show{display:block}
.sheet{background:#fff;border-radius:18px;padding:18px;max-width:700px;margin:30px auto}.field{margin:12px 0}.field label{display:block;font-weight:600;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}.field textarea{min-height:100px}
.day{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:12px}.day h3{margin:0 0 8px}
.shop-item{background:#fff;padding:12px;border-bottom:1px solid #eee}
.empty{padding:25px;text-align:center;color:#777}
</style>
</head>
<body>
<header>
  <h1>🍲 Mi Recetario</h1>
  <input id="search" class="search" placeholder="Buscar receta o ingrediente">
</header>

<main>
<section id="recipesTab" class="tab active">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>Recetas</h2><button id="addBtn">＋ Receta</button>
  </div>
  <div id="recipeGrid" class="grid"></div>
</section>

<section id="menuTab" class="tab">
  <h2>📅 Menú semanal</h2>
  <div id="week"></div>
</section>

<section id="shopTab" class="tab">
  <h2>🛒 Lista de compra</h2>
  <div id="shopping"></div>
</section>
</main>

<button id="fab" class="fab" type="button">＋</button>

<nav>
 <button type="button" data-tab="recipesTab" class="nav-active">🔎<br>Recetas</button>
 <button type="button" data-tab="menuTab">📅<br>Menú</button>
 <button type="button" data-tab="shopTab">🛒<br>Compra</button>
</nav>

<div id="modal" class="modal">
 <div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center">
   <h2 id="modalTitle">Nueva receta</h2><button id="closeModal" class="secondary">Cerrar</button>
  </div>
  <div class="field"><label>Nombre</label><input id="fName"></div>
  <div class="field"><label>Categoría</label><input id="fCat"></div>
  <div class="field"><label>Raciones</label><input id="fServ" type="number" value="2" min="1"></div>
  <div class="field"><label>Tiempo</label><input id="fTime"></div>
  <div class="field"><label>Ingredientes (uno por línea)</label><textarea id="fIng"></textarea></div>
  <div class="field"><label>Preparación</label><textarea id="fSteps"></textarea></div>
  <div class="actions"><button id="saveRecipe">Guardar receta</button><button id="cancelRecipe" class="secondary">Cancelar</button></div>
 </div>
</div>

<script>
(function(){
"use strict";
const seed=[
 {id:1,name:"Arroz con habichuelas",category:"Comida, Guisos, Legumbres",servings:4,time:"45 min",ingredients:"1 pimiento verde\\n3-4 ajos\\nAlcachofas\\nTomate rallado\\nPimentón\\nAgua\\n1 bote de habichuelas",steps:"Sofreír las verduras. Añadir pimentón y tomate. Cocer con agua y habichuelas."},
 {id:2,name:"Arroz con leche",category:"Postres",servings:4,time:"40 min",ingredients:"Arroz\\nLeche\\nCanela\\nAzúcar",steps:"Cocer el arroz con la leche, canela y azúcar."},
 {id:3,name:"Boniato al horno",category:"Cena, Guarnición",servings:2,time:"35 min",ingredients:"Boniato",steps:"Hornear hasta que esté tierno."},
 {id:4,name:"Boniato con carne picada",category:"Comida",servings:2,time:"30 min",ingredients:"Boniato\\nCarne picada",steps:"Cocinar la carne y servir con el boniato."},
 {id:5,name:"Boquerones en vinagre",category:"Entrante, Pescado",servings:4,time:"20 min",ingredients:"Boquerones\\nVinagre\\nAceite\\nAjo",steps:"Preparar y marinar los boquerones."},
 {id:6,name:"Boquerones a la plancha",category:"Cena, Pescado",servings:2,time:"15 min",ingredients:"Boquerones\\nAceite\\nSal",steps:"Cocinar a la plancha."},
 {id:7,name:"Verduras Air Fryer",category:"Guarnición, Cena",servings:2,time:"10 min",ingredients:"Verduras congeladas",steps:"Cocinar en air fryer."}
];
let recipes=JSON.parse(localStorage.getItem("mr_recipes")||"null")||seed;
let menu=JSON.parse(localStorage.getItem("mr_menu")||"null")||Array.from({length:7},()=>({}));
const days=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("mr_recipes",JSON.stringify(recipes));localStorage.setItem("mr_menu",JSON.stringify(menu));}
function clean(s){return String(s||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toLowerCase();}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}

function renderRecipes(){
 const q=clean($("search").value);
 const list=recipes.filter(r=>clean(r.name+" "+r.category+" "+r.ingredients).includes(q));
 $("recipeGrid").innerHTML=list.length?list.map(r=>`
 <article class="card">
  <h3>${esc(r.name)}</h3><div class="muted">${esc(r.category||"")} · ${r.servings||2} raciones · ${esc(r.time||"")}</div>
  <div class="actions"><button type="button" data-view="${r.id}">Ver</button><button type="button" class="secondary" data-edit="${r.id}">Editar</button><button type="button" class="secondary" data-del="${r.id}">Borrar</button></div>
 </article>`).join(""):"<div class='empty'>No hay recetas.</div>";
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>viewRecipe(+b.dataset.view));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(+b.dataset.edit));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("¿Borrar esta receta?")){recipes=recipes.filter(r=>r.id!==+b.dataset.del);save();renderAll();}});
}
function openEditor(id){
 const r=id?recipes.find(x=>x.id===id):{name:"",category:"",servings:2,time:"",ingredients:"",steps:""};
 $("modalTitle").textContent=id?"Editar receta":"Nueva receta";
 $("fName").value=r.name||"";$("fCat").value=r.category||"";$("fServ").value=r.servings||2;$("fTime").value=r.time||"";$("fIng").value=r.ingredients||"";$("fSteps").value=r.steps||"";
 $("modal").dataset.editId=id||"";$("modal").classList.add("show");$("fName").focus();
}
function close(){ $("modal").classList.remove("show"); }
function viewRecipe(id){
 const r=recipes.find(x=>x.id===id); if(!r)return;
 $("modalTitle").textContent=r.name;
 $("fName").value=r.name;$("fCat").value=r.category||"";$("fServ").value=r.servings||2;$("fTime").value=r.time||"";$("fIng").value=r.ingredients||"";$("fSteps").value=r.steps||"";
 $("modal").dataset.viewOnly="1";["fName","fCat","fServ","fTime","fIng","fSteps"].forEach(id=>$ (id).disabled=true);
 $("saveRecipe").style.display="none";$("modal").classList.add("show");
}
function resetEditor(){["fName","fCat","fServ","fTime","fIng","fSteps"].forEach(id=>$ (id).disabled=false);$("saveRecipe").style.display="";$("modal").dataset.viewOnly="";}

$("addBtn").onclick=()=>{resetEditor();openEditor(null);};
$("fab").onclick=()=>{resetEditor();openEditor(null);};
$("closeModal").onclick=()=>{resetEditor();close();};
$("cancelRecipe").onclick=()=>{resetEditor();close();};
$("modal").onclick=e=>{if(e.target===e.currentTarget){resetEditor();close();}};
$("saveRecipe").onclick=()=>{
 const name=$("fName").value.trim(); if(!name){alert("Escribe el nombre de la receta");return;}
 const id=+$("modal").dataset.editId;
 const obj={id:id||Date.now(),name,category:$("fCat").value.trim(),servings:+$("fServ").value||2,time:$("fTime").value.trim(),ingredients:$("fIng").value.trim(),steps:$("fSteps").value.trim()};
 if(id) recipes=recipes.map(r=>r.id===id?obj:r); else recipes.push(obj);
 save();resetEditor();close();renderAll();
};

function renderMenu(){
 $("week").innerHTML=days.map((d,i)=>`<div class="day"><h3>${d}</h3>${["Desayuno","Comida","Cena"].map(type=>{
 const key=type.toLowerCase(),val=menu[i][key]||"";
 return `<label class="muted">${type}</label><select data-day="${i}" data-meal="${key}" style="width:100%;margin:4px 0 10px;padding:10px;border:1px solid #ccc;border-radius:10px"><option value="">— Sin receta —</option>${recipes.map(r=>`<option value="${r.id}" ${String(r.id)===String(val)?"selected":""}>${esc(r.name)}</option>`).join("")}</select>`;
 }).join("")}</div>`).join("");
 document.querySelectorAll("select[data-day]").forEach(s=>s.onchange=()=>{menu[+s.dataset.day][s.dataset.meal]=s.value?+s.value:null;save();renderShopping();});
}
function renderShopping(){
 const counts={};
 menu.forEach(day=>Object.values(day).forEach(id=>{const r=recipes.find(x=>x.id===id);if(r)(r.ingredients||"").split(/\\n|,/).map(x=>x.trim()).filter(Boolean).forEach(i=>counts[i]=(counts[i]||0)+1);}));
 const items=Object.entries(counts);
 $("shopping").innerHTML=items.length?items.map(([i,n])=>`<div class="shop-item">☐ ${esc(i)}${n>1?" × "+n:""}</div>`).join(""):"<div class='empty'>Selecciona recetas en el menú semanal.</div>";
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("nav-active"));
 b.classList.add("nav-active");
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 $(b.dataset.tab).classList.add("active");
});
$("search").oninput=renderRecipes;
function renderAll(){renderRecipes();renderMenu();renderShopping();}
renderAll();
})();
</script>
</body>
</html>
